  doi = {10.1109/ACCESS.2023.3245833},
  urldate = {2024-04-23},
  abstract = {In hazardous environments, where conditions present risks for humans, the maintenance and interventions are often done with teleoperated remote systems or mobile robotic manipulators to avoid human exposure to dangers. The increasing need for safe and efficient teleoperation requires advanced environmental awareness and collision avoidance. The up-to-date screen-based 2D or 3D interfaces do not fully allow the operator to immerse in the controlled scenario. This problem can be addressed with the emerging Mixed Reality (MR) technologies with Head-Mounted Devices (HMDs) that offer stereoscopic immersion and interaction with virtual objects. Such human-robot interfaces have not yet been demonstrated in telerobotic interventions in particle physics accelerators. Moreover, the operations often require a few experts to collaborate, which increases the system complexity and requires sharing an Augmented Reality (AR) workspace. The multi-user mobile telerobotics in hazardous environments with shared control in the AR has not yet been approached in the state-of-the-art. In this work, the developed MR human-robot interface using the AR HMD is presented. The interface adapts to the constrained wireless networks in particle accelerator facilities and provides reliable high-precision interaction and specialized visualization. The multimodal operation uses hands, eyes and user motion tracking, and voice recognition for control, as well as offers video, 3D point cloud and audio feedback from the robot. Multiple experts can collaborate in the AR workspace locally or remotely, and share or monitor the robot's control. Ten operators tested the interface in intervention scenarios in the European Organization for Nuclear Research (CERN) with complete network characterization and measurements to conclude if operational requirements were met and if the network architecture could support single and multi-user communication load. The interface system has proved to be operationally ready at the Technical Readiness Level (TRL) 8 and was validated through successful demonstration in single and multi-user missions. Some system limitations and further work areas were identified, such as optimizing the network architecture for multi-user scenarios or high-level interface actions applying automatic interaction strategies depending on network conditions.},
  keywords = {Augmented reality,Augmented Reality,Collaboration,Collision avoidance,facility maintenance,hand tracking,hazardous environment,Human factors,human-robot interaction,mixed reality,mobile network,mobile robotic manipulator,Mobile robots,multi-user,point cloud,Robot sensing systems,safe operations,Safety,spatial perception,telerobotics,Telerobotics,Three-dimensional displays,voice control},
  file = {D:\\_Zotero\\storage\\RACV3J2D\\Szczurek et al_2023_Multimodal Multi-User Mixed Reality Human–Robot Interface for Remote Operations.pdf}

  abstract = {Scalable multi-user interactions on diverse extended reality (XR) devices are vital for the metaverse's fruition. However, issues like broad user access, intensive interaction rendering, and limited device resources complicate existing interactions based on client-server and peer-to-peer structures. The metaverse's demands for scalable access and detailed scene rendering intensify these problems. In response, we present SCAXR, a collaborative architecture enhancing multi-user interaction. SCAXR leverages three key components: an on-demand rendering module, a distributed rendering process, and edge-cloud synchronization. This module ensures timely communication between XR devices and edge servers. We tested SCAXR's efficacy with a Unity Render Streaming-based XR meeting prototype. Results show SCAXR boosts access capacity by 50\\% over traditional methods and enhances complex scene interaction performance by up to 7.8 times in rendering frequency.},
  keywords = {Computer architecture,Graphics processing units,Peer-to-peer computing,Rendering (computer graphics),Servers,Synchronization,X reality},
  file = {D\\:\\\\_Zotero\\\\storage\\\\C2EBMI6B\\\\Huang et al. - 2024 - SCAXR Empowering Scalable Multi-User Interaction for Heterogeneous XR Devices.pdf;D\\:\\\\_Zotero\\\\storage\\\\GK4874PD\\\\10269715.html}
}`,DOI:"10.1109/MNET.2023.3320440","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Social & Play"],"Study Task":["no study"],"device limitations":["general - device limitations"],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":["scalability","computational challenges","heterogeneity & interoperability","devices & sensors"],"latency & real-time presentation":["performance","synchronicity","general latency"],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2023",Authors:["Santawat Thanyadit","Matthias Heintz","Effie L-C Law"],Name:"Tutor In-sight: Guiding and Visualizing Students’ Attention with Mixed Reality Avatar Presentation Tools",Bibtex:`@inproceedings{thanyadit2023tutor,

  booktitle = {Proceedings of the 2023 {{CHI Conference}} on {{Human Factors}} in {{Computing Systems}}},
  author = {Thanyadit, Santawat and Heintz, Matthias and Law, Effie L-C},

  urldate = {2024-07-31},
  abstract = {Remote conferencing systems are increasingly used to supplement or even replace in-person teaching. However, prevailing conferencing systems restrict the teacher's representation to a webcam live-stream, hamper the teacher's use of body-language, and result in students' decreased sense of co-presence and participation. While Virtual Reality (VR) systems may increase student engagement, the teacher may not have the time or expertise to conduct the lecture in VR. To address this issue and bridge the requirements between students and teachers, we have developed Tutor In-sight, a Mixed Reality (MR) avatar augmented into the student's workspace based on four design requirements derived from the existing literature, namely: integrated virtual with physical space, improved teacher's co-presence through avatar, direct attention with auto-generated body language, and usable workflow for teachers. Two user studies were conducted from the perspectives of students and teachers to determine the advantages of Tutor In-sight in comparison to two existing conferencing systems, Zoom (video-based) and Mozilla Hubs (VR-based). The participants of both studies favoured Tutor In-sight. Among others, this main finding indicates that Tutor In-sight satisfied the needs of both teachers and students. In addition, the participants' feedback was used to empirically determine the four main teacher requirements and the four main student requirements in order to improve the future design of MR educational tools.},
  isbn = {978-1-4503-9421-5},
  file = {D:\\_Zotero\\storage\\4Q848AWY\\Thanyadit et al_2023_Tutor In-sight.pdf}

  title = {Visual {{Guidance}} for {{User Placement}} in {{Avatar-Mediated Telepresence}} between {{Dissimilar Spaces}}},
  author = {Yang, Dongseok and Kang, Jiho and Kim, Taehei and Lee, Sung-Hee},

  urldate = {2024-08-01},
  abstract = {Rapid advances in technology gradually realize immersive mixed-reality (MR) telepresence between distant spaces. This paper presents a novel visual guidance system for avatar-mediated telepresence, directing users to optimal placements that facilitate the clear transfer of gaze and pointing contexts through remote avatars in dissimilar spaces, where the spatial relationship between the remote avatar and the interaction targets may differ from that of the local user. Representing the spatial relationship between the user/avatar and interaction targets with angle-based interaction features, we assign recommendation scores of sampled local placements as their maximum feature similarity with remote placements. These scores are visualized as color-coded 2D sectors to inform the users of better placements for interaction with selected targets. In addition, virtual objects of the remote space are overlapped with the local space for the user to better understand the recommendations. We examine whether the proposed score measure agrees with the actual user perception of the partner's interaction context and find a score threshold for recommendation through user experiments in virtual reality (VR). A subsequent user study in VR investigates the effectiveness and perceptual overload of different combinations of visualizations. Finally, we conduct a user study in an MR telepresence scenario to evaluate the effectiveness of our method in real-world applications.},

  pages     = {1--5},
  abstract  = {Technologically demanding sectors of the economy are confronted with a lot of personnel, regulatory and technical challenges. The availability of powerful and efficiency-promoting processes and tools is of crucial importance, especially for companies dealing with after sales and customer service. A solution approach is offered by the use of virtual and extended/augmented reality (VR, AR). Fully virtual environments allow alternative training and the delivery of particularly vivid remote sup-port. This paper deals with the continuous support of the customer service employee using AR. A seamless mapping of the process from vehicle acceptance to diagnosis, switching to the appropriate repair process, quality control and completion of the order is shown. The potential of AR support is shown based on the results of a comparative study.},

  urldate = {2024-09-08},
  abstract = {Enabling collaborative telepresence in healthcare, especially surgical procedures, presents a critical challenge. The decompressive craniotomy procedure stands out as particularly complex and time-sensitive. The current teleconsultation approach relies on 2D color cameras, often offering only a fixed view and limited visual capabilities between experts and surgeons. However, teleconsultation can be addressed with Mixed Reality and immersive technology to potentially enable a better consultation of the procedure. We conducted an extensive user study focusing on decompressive craniotomy to investigate the advantages and challenges of our 3D teleconsultation system compared to a 2D video-based consultation system. Our 3D teleconsultation system leverages real-time 3D reconstruction of the patient and environment to empower experts to provide guidance and create virtual 3D annotations. The study utilized 3D-printed head models to perform a lifelike surgical intervention. It involved 14 medical residents and demonstrated an in-vitro 17\\% improvement in accurately describing the incision size on the patient's head, contributing to potentially improved patient outcomes.},
