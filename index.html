  abstract = {The Metaverse [Mystakidis 2022], represents a universe beyond reality, where the boundaries between the physical and digital realms merge seamlessly. It exists as a continuous and enduring multi-user environment, facilitated by the convergence of technologies that allow for immersive interactions with virtual environments such as Virtual Reality (VR), Augmented Reality (AR), digital entities, and workers. The approach in the application of this concept, in a real use case in an electrical substation, involves a bridge between MR and VR technologies, for a multi-user and multi-platform remote collaboration, supported by 5G communications and Edge Computing to manage visualisation and interaction through a cloud video-audio streaming. There is also management of real data acquisition from an autonomous mobile field robot, BIM Models of electrical structures and the integration of complex information systems, adding context to the experience.},

}`,DOI:"10.1145/3611314.3618133","Use Case: Task/Task Type":["Instruction & Guidance"],"Use Case: Domain":["Maintenance & Industry"],"Study Task":["no study"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":["heterogeneity & interoperability"],"latency & real-time presentation":[],"spatial consistency":["calibration & alignment"],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2023",Authors:["Manuel Rebol","Krzysztof Pietroszek","Neal Sikka","Claudia Ranniger","Colton Hood","Adam Rutenberg","Puja Sasankan","Christian G{\\u}tl"],Name:"Evaluating Augmented Reality Communication: How Can We Teach Procedural Skill in AR?",Bibtex:`@inproceedings{rebol2023evaluating,

  doi = {10.1145/3611659.3615685},
  abstract = {Augmented reality (AR) has great potential for use in healthcare applications, especially remote medical training and supervision. In this paper, we analyze the usage of an AR communication system to teach a medical procedure, the placement of a central venous catheter (CVC) under ultrasound guidance. We examine various AR communication and collaboration components, including gestural communication, volumetric information, annotations, augmented objects, and augmented screens. We compare how teaching in AR differs from teaching through videoconferencing-based communication. Our results include a detailed medical training steps analysis in which we compare how verbal and visual communication differs between video and AR training. We identify procedural steps in which medical experts give visual instructions utilizing AR components. We examine the change in AR usage and interaction over time and recognize patterns between users. Moreover, AR design recommendations are given based on post-training interviews.},

  abstract = {The combination of smartphone Augmented Reality (AR) and Virtual Reality (VR) makes it possible for on-site and remote users to simultaneously explore a physical space and its digital twin through an asymmetric Collaborative Virtual Environment (CVE). In this paper, we investigate two spatial awareness visualizations to enable joint exploration of a space for dyads consisting of a smartphone AR user and a head-mounted display VR user. Our study revealed that both, a mini-map-based method and an egocentric compass method with a path visualization, enabled the on-site visitors to locate and follow a virtual companion reliably and quickly. Furthermore, the embodiment of the AR user by an inverse kinematics avatar allowed the use of natural gestures such as pointing and waving which was preferred over text messages by the participants of our study. In an expert review in a museum and its digital twin we observed an overall high social presence for on-site AR and remote VR visitors and found that the visualizations and the avatar embodiment successfully facilitated their communication and collaboration.},

}`,DOI:"10.1145/3611659.3615708","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Social & Play"],"Study Task":["training, instruction, guiding"],"device limitations":["tracking","display"],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":["heterogeneity & interoperability"],"latency & real-time presentation":[],"spatial consistency":["calibration & alignment"],"shared & blended environment":[],"spatial awareness & orientation":["locating  objects & user"],"user representation & techniques":["general - user representation & techniques"],"communication & sensory feedback":["non-verbal","gestures"],"interpersonal awareness":["content & intention sharing"],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":["interaction & general capabilities"],"interaction & UI design":["general - interaction & UI design"],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2023",Authors:["Faisal Zaman","Craig Anslow","Taehyun James Rhee"],Name:"Vicarious: Context-aware Viewpoints Selection for Mixed Reality Collaboration",Bibtex:`@inproceedings{zaman2023vicarious,

  doi = {10.1145/3611659.3615709},
  abstract = {Mixed-perspective, combining egocentric (first-person) and exocentric (third-person) viewpoints, have been shown to improve the collaborative experience in remote settings. Such experiences allow remote users to switch between different viewpoints to gain alternative perspectives of the remote space. However, existing systems lack seamless selection and transition between multiple perspectives that better fit the task at hand. To address this, we present a new approach called Vicarious, which simplifies and automates the selection between egocentric and exocentric viewpoints. Vicarious employs a context-aware method for dynamically switching or highlighting the optimal viewpoint based on user actions and the current context. To evaluate the effectiveness of the viewpoint selection method, we conducted a user study (n = 27) using an asymmetric AR-VR setup where users performed remote collaboration tasks under four distinct conditions: No-view, Manual, Guided, and Automatic selection. The results showed that Guided and Automatic viewpoint selection improved users' understanding of the task space and task performance, and reduced cognitive load compared to Manual or No-view selection. The results also suggest that the asymmetric setup had minimal impact on spatial and social presence, except for differences in task load and preference. Based on these findings, we provide design implications for future research in mixed reality collaboration.},

}`,DOI:"10.1145/3611659.3615709","Use Case: Task/Task Type":["Instruction & Guidance"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["puzzle and assembly"],"device limitations":[],"scene acquisition & reconstruction":["general - scene acquisition & reconstruction"],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":["bandwidth issue"],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":["gaze & view sharing"],"cognition & presence":["cognitive & mental load"],"accessibility & inclusion":[],"asymmetric experiences":["content & environment sharing"],"interaction & UI design":["general - interaction & UI design"],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2024",Authors:["Jens Emil Sloth Gr{\\o}nb{\\ae}k","Juan S{\\'a}nchez Esquivel","Germ{\\'a}n Leiva","Eduardo Velloso","Hans Gellersen","Ken Pfeuffer"],Name:"Blended Whiteboard: Physicality and Reconfigurability in Remote Mixed Reality Collaboration",Bibtex:`@inproceedings{gronbaek2024blended,

  author = {Gr{\\o}nb{\\ae}k, Jens Emil Sloth and S{\\'a}nchez Esquivel, Juan and Leiva, Germ{\\'a}n and Velloso, Eduardo and Gellersen, Hans and Pfeuffer, Ken},

  doi = {10.1145/3613904.3642293},
  urldate = {2024-09-08},
  abstract = {The whiteboard is essential for collaborative work. To preserve its physicality in remote collaboration, Mixed Reality (MR) can blend real whiteboards across distributed spaces. Going beyond reality, MR can further enable interactions like panning and zooming in a virtually reconfigurable infinite whiteboard. However, this reconfigurability conflicts with the sense of physicality. To address this tension, we introduce Blended Whiteboard, a remote collaborative MR system enabling reconfigurable surface blending across distributed physical whiteboards. Blended Whiteboard supports a unique collaboration style, where users can sketch on their local whiteboards but also reconfigure the blended space to facilitate transitions between loosely and tightly coupled work. We describe design principles inspired by proxemics; supporting users in changing between facing each other and being side-by-side, and switching between navigating the whiteboard synchronously and independently. Our work shows exciting benefits and challenges of combining physicality and reconfigurability in the design of distributed MR whiteboards.},
  isbn = {9798400703300}
}`,DOI:"10.1145/3613904.3642293","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["information extraction and generation"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":["scalability"],"latency & real-time presentation":[],"spatial consistency":["general - spatial consistency"],"shared & blended environment":["general - shared & blended environment","dissimilar spaces"],"spatial awareness & orientation":["dynamic changes"],"user representation & techniques":["general - user representation & techniques"],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":["content & environment sharing"],"interaction & UI design":["workflow","general - interaction & UI design"],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2024",Authors:["Andrew Irlitti","Mesut Latifoglu","Thuong Hoang","Brandon Victor Syiem","Frank Vetere"],Name:"Volumetric Hybrid Workspaces: Interactions with Objects in Remote and Co-located Telepresence",Bibtex:`@inproceedings{irlitti2024volumetric,

  urldate = {2024-07-31},
  abstract = {Volumetric telepresence aims to create a shared space, allowing people in local and remote settings to collaborate seamlessly. Prior telepresence examples typically have asymmetrical designs, with volumetric capture in one location and objects in one format. In this paper, we present a volumetric telepresence mixed reality system that supports real-time, symmetrical, multi-user, partially distributed interactions, using objects in multiple formats, across multiple locations. We align two volumetric environments around a common spatial feature to create a shared workspace for remote and co-located people using objects in three formats: physical, virtual, and volumetric. We conducted a study with 18 participants over 6 sessions, evaluating how telepresence workspaces support spatial coordination and hybrid communication for co-located and remote users undertaking collaborative tasks. Our findings demonstrate the successful integration of remote spaces, effective use of proxemics and deixis to support negotiation, and strategies to manage interactivity in hybrid workspaces.},

  booktitle = {Extended {{Abstracts}} of the 2024 {{CHI Conference}} on {{Human Factors}} in {{Computing Systems}}},
  author = {Bekta{\\c s}, Kenan and Pandjaitan, Adrian and Strecker, Jannis and Mayer, Simon},

  urldate = {2024-09-08},
  abstract = {Recent research on remote collaboration focuses on improving the sense of co-presence and mutual understanding among the collaborators, whereas there is limited research on using non-verbal cues such as gaze or head direction alongside their main communication channel. Our system -- GlassBoARd -- permits collaborators to see each other's gaze behavior and even make eye contact while communicating verbally and in writing. GlassBoARd features a transparent shared Augmented Reality interface that is situated in-between two users, allowing face-to-face collaboration. From the perspective of each user, the remote collaborator is represented as an avatar that is located behind the GlassBoARd and whose eye movements are contingent on the remote collaborator's instant eye movements. In three iterations, we improved the design of GlassBoARd and tested it with two use cases. Our preliminary evaluations showed that GlassBoARd facilitates an environment for conducting future user experiments to study the effect of sharing eye gaze on the communication bandwidth.},

  author = {Echtler, Florian and Maierh{\\"o}fer, Vitus and Hansen, Nicolai Brodersen and Wimmer, Raphael},
  year = {2023},

  journal = {Proc. ACM Hum.-Comput. Interact.},
  volume = {7},

  publisher = {Association for Computing Machinery},
  address = {New York, NY, USA},
  doi = {10.1145/3626475},
  abstract = {Real-time online interaction is the norm today. Tabletops and other dedicated interactive surface devices with direct input and tangible interaction can enhance remote collaboration, and open up new interaction scenarios based on mixed physical/virtual components. However, they are only available to a small subset of users, as they usually require identical bespoke hardware for every participant, are complex to setup, and need custom scenario-specific applications. We present SurfaceCast, a software toolkit designed to merge multiple distributed, heterogeneous end-user devices into a single, shared mixed-reality surface. Supported devices include regular desktop and laptop computers, tablets, and mixed-reality headsets, as well as projector-camera setups and dedicated interactive tabletop systems. This device-agnostic approach provides a fundamental building block for exploration of a far wider range of usage scenarios than previously feasible, including future clients using our provided API. In this paper, we discuss the software architecture of SurfaceCast, present a formative user study and a quantitative performance analysis of our framework, and introduce five example application scenarios which we enhance through the multi-user and multi-device features of the framework. Our results show that the hardware- and content-agnostic architecture of SurfaceCast can run on a wide variety of devices with sufficient performance and fidelity for real-time interaction.},

  doi = {10.1145/3631418},
  abstract = {Shared Mixed Reality experiences allow two co-located users to collaborate on both physical and digital tasks with familiar social protocols. However, extending the same to remote collaboration is limited by cumbersome setups for aligning distinct physical environments and the lack of access to remote physical artifacts. We present SurfShare, a general-purpose symmetric remote collaboration system with mixed-reality head-mounted displays (HMDs). Our system shares a spatially consistent physical-virtual workspace between two remote users, anchored on a physical plane in each environment (e.g., a desk or wall). The video feed of each user's physical surface is overlaid virtually on the other side, creating a shared view of the physical space. We integrate the physical and virtual workspace through virtual replication. Users can transmute physical objects to the virtual space as virtual replicas. Our system is lightweight, implemented using only the capabilities of the headset, without requiring any modifications to the environment (e.g. cameras or motion tracking hardware). We discuss the design, implementation, and interaction capabilities of our prototype, and demonstrate the utility of SurfShare through four example applications. In a user experiment with a comprehensive prototyping task, we found that SurfShare provides a physical-virtual workspace that supports low-fi prototyping with flexible proxemics and fluid collaboration dynamics.},

  urldate = {2024-07-31},
  abstract = {Collaboration in distributed mixed reality (MR) creates co-presence illusions by bringing a digital representation of the remote collaborator into the local user's physical space. However, constraints in each physical environment, such as different spatial layouts and furniture, can hinder collaboration and momentarily break the illusion of co-location. Since the remote user's physical space is invisible to the local user, the source of the interaction problem is often imperceptible, leading to familiar real-world interactions suddenly feeling unfamiliar---a concept we term the Jamais Vu Effect. In this paper, we conceptualise and demonstrate this effect through a five-part user study that elicits the user experience of the Jamais Vu Effect in MR. We contribute a shared vocabulary and understanding of spatial interface design challenges to help designers and researchers discuss and improve distributed collaboration in MR.},

  abstract = {Immersive technologies like eXtended Reality (XR) are the next step in videoconferencing. In this context, understanding the effect of delay on communication is crucial. This article presents the first study on the impact of delay on collaborative tasks using a realistic Social XR system. Specifically, we design an experiment and evaluate the impact of end-to-end delays of 300, 600, 900, 1,200, and 1,500 ms on the execution of a standardized task involving the collaboration of two remote users that meet in a virtual space and construct block-based shapes. To measure the impact of the delay in this communication scenario, objective and subjective data were collected. As objective data, we measured the time required to execute the tasks and computed conversational characteristics by analyzing the recorded audio signals. As subjective data, a questionnaire was prepared and completed by every user to evaluate different factors such as overall quality, perception of delay, annoyance using the system, level of presence, cybersickness, and other subjective factors associated with social interaction. The results show a clear influence of the delay on the perceived quality and a significant negative effect as the delay increases. Specifically, the results indicate that the acceptable threshold for end-to-end delay should not exceed 900 ms. This article additionally provides guidelines for developing standardized XR tasks for assessing interaction in Social XR environments.},

  abstract = {Mixed reality (MR) technologies are widely used in distributed collaborative learning scenarios and have made learning and training more flexible and intuitive. However, there are many challenges in the use of MR due to the difficulty in creating a physical presence, particularly when a physical task is being performed collaboratively. We therefore developed a novel MR system to overcomes these limitations and enhance the distributed collaboration user experience. The primary objective of this paper is to explore the potential of a MR-based hand gestures system to enhance the conceptual architecture of MR in terms of both visualization and interaction in distributed collaboration. We propose a synchronous prototype named MRCollab as an immersive collaborative approach that allows two or more users to communicate with a peer based on the integration of several technologies such as video, audio, and hand gestures.},

  abstract = {Despite the importance of avatar representation on user experience for Mixed Reality (MR) remote collaboration involving various device environments and large amounts of task-related information, studies on how controlling visual parameters for avatars can benefit users in such situations have been scarce. Thus, we conducted a user study comparing the effects of three avatars with different transparency levels (Nontransparent, Semi-transparent, and Near-transparent) on social presence for users in Augmented Reality (AR) and Virtual Reality (VR) during task-centric MR remote collaboration. Results show that avatars with a strong visual presence are not required in situations where accomplishing the collaborative task is prioritized over social interaction. However, AR users preferred more vivid avatars than VR users. Based on our findings, we suggest guidelines on how different levels of avatar transparency should be applied based on the context of the task and device type for MR remote collaboration.},

  urldate = {2024-04-23},
  abstract = {In this paper, we explore how virtual replicas can enhance Mixed Reality (MR) remote collaboration with a 3D reconstruction of the task space. People in different locations may need to work together remotely on complicated tasks. For example, a local user could follow a remote expert's instructions to complete a physical task. However, it could be challenging for the local user to fully understand the remote expert's intentions without effective spatial referencing and action demonstration. In this research, we investigate how virtual replicas can work as a spatial communication cue to improve MR remote collaboration. This approach segments the foreground manipulable objects in the local environment and creates corresponding virtual replicas of physical task objects. The remote user can then manipulate these virtual replicas to explain the task and guide their partner. This enables the local user to rapidly and accurately understand the remote expert's intentions and instructions. Our user study with an object assembly task found that using virtual replica manipulation was more efficient than using 3D annotation drawing in an MR remote collaboration scenario. We report and discuss the findings and limitations of our system and study, and present directions for future research.},

  urldate = {2024-04-22},
  abstract = {Collaboration plays a vital role in both academia and industry whenever we need to browse through a big amount of data to extract meaningful insights. These collaborations often involve people living far from each other, with different levels of access to technology. Effective cross-border collaborations require reliable telepresence systems that provide support for communication, cooperation, and understanding of contextual cues. In the context of collaborative academic writing, while immersive technologies offer novel ways to enhance collaboration and enable efficient information exchange in a shared workspace, traditional devices such as laptops still offer better readability for longer articles. We propose the design of a hybrid cross-reality cross-device networked system that allows the users to harness the advantages of both worlds. Our system allows users to import documents from their personal computers (PC) to an immersive headset, facilitating document sharing and simultaneous collaboration with both colocated colleagues and remote colleagues. Our system also enables a user to seamlessly transition between Virtual Reality, Augmented Reality, and the traditional PC environment, all within a shared workspace. We present the real-world scenario of a global academic team conducting a comprehensive literature review, demonstrating its potential for enhancing cross-reality hybrid collaboration and productivity.},

  urldate = {2024-09-06},
  abstract = {In this work, we explore how advances in augmented reality technologies are creating a new design space for long-distance telepresence communication through virtual avatars. Studies have shown that the relative size of a speaker has a significant impact on many aspects of human communication including perceived dominance and persuasiveness. Our system synchronizes the body pose of a remote user with a realistic, virtual human avatar visible to a local user wearing an augmented reality head-mounted display. We conducted a two-by-two (relative system size: equivalent vs. small; leader vs. follower), between participants study (N = 40) to investigate the effect of avatar size on the interactions between remote and local user. We found the equal-sized avatars to be significantly more influential than the small-sized avatars and that the small avatars commanded significantly less attention than the equal-sized avatars. Additionally, we found the assigned leadership role to significantly impact participant subjective satisfaction of the task outcome.},

  urldate = {2024-02-13},
  abstract = {This paper evaluates factors of social presence during a dynamic remote collaboration task in a technologically asymmetric Mixed Reality (MR) setting for two spatial layouts. While active movement during MR remote collaboration is afforded by how the shared 3D space is mediated and configured, studies investigating the impact of these conditions on user experience have been scarce. In a between-group study ({\\textbackslash}mathrmn=48), a host user in Augmented Reality (AR) and a remote user in Virtual Reality (VR), both wearing Head Mounted Displays (HMDs), simultaneously moved around the shared space to find and assemble parts of a Mars exploration rover together, one group in a Peripheral layout and the other in a Scattered layout with disparate levels of spatial affordance. Results show that while VR facilitates higher co-presence and spatial presence than AR through HMDs, the Peripheral layout enables users to pay more attention to one another than the Scattered. We analyze the results and derive implications aimed at bridging the AR-VR gap in social presence for dynamic MR remote collaboration through the adaptive placement of virtual content in shared spaces.},

  urldate = {2024-04-19},
  abstract = {Telecollaboration involves the teleportation of a remote collaborator to another real-world environment where their partner is located. The fidelity of the environment plays an important role for allowing corresponding spatial references in remote collaboration. We present a novel asymmetric platform, Augmented Virtual Teleportation (AVT), which provides high-fidelity telepresence of a remote VR user (VR-Traveler) into a real-world collaboration space to interact with a local AR user (AR-Host). AVT uses a 360{$^\\circ$} video camera (360-camera) that captures and live-streams the omni-directional scenes over a network. The remote VR-Traveler watching the video in a VR headset experiences live presence and co-presence in the real-world collaboration space. The VR-Traveler's movements are captured and transmitted to a 3D avatar overlaid onto the 360-camera which can be seen in the AR-Host's display. The visual and audio cues for each collaborator are synchronized in the Mixed Reality Collaboration space (MRC-space), where they can interactively edit virtual objects and collaborate in the real environment using the real objects as a reference. High fidelity, real-time rendering of virtual objects and seamless blending into the real scene allows for unique mixed reality use-case scenarios. Our working prototype has been tested with a user study to evaluate spatial presence, co-presence, and user satisfaction during telecollaboration. Possible applications of AVT are identified and proposed to guide future usage.},

  doi = {10.1109/VR.2019.8797719},
  abstract = {This paper investigates the effect of avatar appearance on Social Presence and users' perception in an Augmented Reality (AR) telepresence system. Despite the development of various commercial 3D telepresence systems, there has been little evaluation and discussions about the appearance of the collaborator's avatars. We conducted two user studies comparing the effect of avatar appearances with three levels of body part visibility (head \\& hands, upper body, and whole body) and two different character styles (realistic and cartoon-like) on Social Presence while performing two different remote collaboration tasks. We found that a realistic whole body avatar was perceived as being the best for remote collaboration, but an upper body or cartoon style could be considered as a substitute depending on the collaboration context. We discuss these results and suggest guidelines for designing future avatar-mediated AR remote collaboration systems.},

  urldate = {2024-04-23},
  abstract = {A 3D Telepresence system allows users to interact with each other in a virtual, mixed, or augmented reality (VR, MR, AR) environment, creating a shared space for collaboration and communication. There are two main methods for representing users within these 3D environments. Users can be represented either as point cloud reconstruction-based avatars that resemble a physical user or as virtual character-based avatars controlled by tracking the users' body motion. This work compares both techniques to identify the differences between user representations and their fit in the reconstructed environments regarding the perceived presence, uncanny valley factors, and behavior impression. Our study uses an asymmetric VR/AR teleconsultation system that allows a remote user to join a local scene using VR. The local user observes the remote user with an AR head-mounted display, leading to facial occlusions in the 3D reconstruction. Participants perform a warm-up interaction task followed by a goal-directed collaborative puzzle task, pursuing a common goal. The local user was represented either as a point cloud reconstruction or as a virtual character-based avatar, in which case the point cloud reconstruction of the local user was masked. Our results show that the point cloud reconstruction-based avatar was superior to the virtual character avatar regarding perceived co-presence, social presence, behavioral impression, and humanness. Further, we found that the task type partly affected the perception. The point cloud reconstruction-based approach led to higher usability ratings, while objective performance measures showed no significant difference. We conclude that despite partly missing facial information, the point cloud-based reconstruction resulted in better conveyance of the user behavior and a more coherent fit into the simulation context.},

  urldate = {2024-04-23},
  abstract = {Remote assistance tools in customer support allow for fast response times and reduced service expenses. Video and screen-based applications are widely used in various areas but lack spatial interactivity due to the limitation to a two-dimensional screen. Mixed reality-supported remote collaboration is frequently addressed in research as a way to extend the interaction space. The presented systems often require complicated device setups, calibration, or precomputation for reconstruction of the physical environment. This work investigates a novel approach for location-independent remote assistance and collaboration utilizing state-of-the-art mixed reality devices without any additional hardware modifications. In our approach a local user scans the environment using a HoloLens' standard depth camera. The data is transferred to a remote user equipped with a Virtual Reality headset, where the environment is reconstructed in real-time. The users can interact in the same shared environment. In a user study, the perceived workload was measured for both sides to examine the practical applicability of our approach. The results show that for local users the tasks set resulted in a low mental load, but also indicate that the coarse representation of the environment was mentally demanding for the remote users to work with. With our work we want to make remote collaboration easier and viable for a broader range of applications and facilitate interactions between globally distributed users.},

}`,DOI:"10.1109/ISMAR-Adjunct57072.2022.00023","Use Case: Task/Task Type":["Instruction & Guidance"],"Use Case: Domain":["Maintenance & Industry"],"Study Task":["locating object in environment"],"device limitations":["general - device limitations","display"],"scene acquisition & reconstruction":["point cloud Level of Detail"],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":["performance","bandwidth issue","synchronicity"],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":["locating  objects & user"],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":["content & intention sharing"],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":["content & environment sharing","awareness on shared personal information"],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2018",Authors:["Gun A. Lee","Theophilus Teo","Seungwon Kim","Mark Billinghurst"],Name:"A User Study on MR Remote Collaboration Using Live 360 Video",Bibtex:`@inproceedings{lee2018user,
  title = {A {{User Study}} on {{MR Remote Collaboration Using Live}} 360 {{Video}}},
  booktitle = {2018 {{IEEE International Symposium}} on {{Mixed}} and {{Augmented Reality}} ({{ISMAR}})},

  urldate = {2024-09-08},
  abstract = {Sharing and watching live 360 panorama video is available on modern social networking platforms, yet the communication is often a passive one-directional experience. This research investigates how to further improve live 360 panorama based remote collaborative experiences by adding Mixed Reality (MR) cues. SharedSphere is a wearable MR remote collaboration system that enriches a live captured immersive panorama based collaboration through MR visualisation of non-verbal communication cues (e.g., view awareness and gestures cues). We describe the design and implementation details of the prototype system, and report on a user study investigating how MR live panorama sharing affects the user's collaborative experience. The results showed that providing view independence through sharing live panorama enhances co-presence in collaboration, and the MR cues help users understanding each other. Based on the study results we discuss design implications and future research direction.},
  keywords = {Augmented Reality,Cameras,Collaboration,live panorama sharing,Mixed Reality,remote collaboration,Streaming media,Three-dimensional displays,Two dimensional displays,view independence,Virtual reality,Visualization}
}`,DOI:"10.1109/ISMAR.2018.00051","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["locating object in environment"],"device limitations":["ergonomics","display"],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":["general - latency & real-time presentation"],"spatial consistency":[],"shared & blended environment":["general - shared & blended environment"],"spatial awareness & orientation":["communication about the environment","locating  objects & user"],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":["gaze & view sharing"],"cognition & presence":[],"accessibility & inclusion":["accessibility & inclusion"],"asymmetric experiences":[],"interaction & UI design":["general - interaction & UI design"],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2022",Authors:["Seoyoung Kang","Boram Yoon","Bowon Kim","Woontack Woo"],Name:"Effects of Avatar Face Level of Detail Control on Social Presence in Augmented Reality Remote Collaboration",Bibtex:`@inproceedings{kang2022effects,

  booktitle = {2022 {{IEEE International Symposium}} on {{Mixed}} and {{Augmented Reality Adjunct}} ({{ISMAR-Adjunct}})},

  doi = {10.1109/ISMAR-Adjunct57072.2022.00161},
  abstract = {This study explored how avatar face Level of Detail (LOD) and task types affect users' social presence and interpersonal communication in Augmented Reality remote collaboration. In AR remote collaboration, users are represented as avatars, and an actual user's appearance inevitably changes. While certain situations require an avatar that resembles a user, it is challenging to reconstruct everything realistically due to its high cost. Since facial parts show relative significance compared to body parts, we proposed controlling face LOD as an approach to lowering the cost while maintaining social presence in AR environments. Our results showed that while Mid-LOD maintains social presence but reduces costs compared to High-LOD, Low-LOD negatively impacts social presence mainly due to emotional understanding. Based on our findings, we highlight the importance of 1) considering facial expressions and emotional understanding in managing face LOD, 2) figuring out the collaboration context with different effects of tasks and communication behaviors, and 3) providing additional communication cues for maintaining social presence while lowering the cost.},

  title = {Comparing {{Gaze-Supported Modalities}} with {{Empathic Mixed Reality Interfaces}} in {{Remote Collaboration}}},
  booktitle = {2022 {{IEEE International Symposium}} on {{Mixed}} and {{Augmented Reality}} ({{ISMAR}})},
  author = {Jing, Allison and Gupta, Kunal and McDade, Jeremy and Lee, Gun A. and Billinghurst, Mark},

  urldate = {2024-02-13},
  abstract = {In this paper, we share real-time collaborative gaze behaviours, hand pointing, gesturing, and heart rate visualisations between remote collaborators using a live 360 {$^\\circ$} panoramic-video based Mixed Reality (MR) system. We first ran a pilot study to explore visual designs to combine communication cues with biofeedback (heart rate), aiming to understand user perceptions of empathic collaboration. We then conducted a formal study to investigate the effect of modality (Gaze+Hand, Hand-only) and interface (Near-Gaze, Embodied). The results show that the Gaze+Hand modality in a Near-Gaze interface is significantly better at reducing task load, improving co-presence, enhancing understanding and tightening collaborative behaviours compared to the conventional Embodied hand-only experience. Ranked as the most preferred condition, the Gaze+Hand in Near-Gaze condition is perceived to reduce the need for dividing attention to the collaborator's physical location, although it feels slightly less natural compared to the embodied visualisations. In addition, the Gaze+Hand conditions also led to more joint attention and less hand pointing to align mutual understanding. Lastly, we provide a design guideline to summarize what we have learned from the studies on the representation between modality, interface, and biofeedback.},

  urldate = {2024-04-23},
  abstract = {Good collaboration is about clearance between all the team members to let everyone work transparently towards one goal. Augmented Reality was one of the technologies used for data visualization for an immersive and better understanding and analysis of the data. Hence, the collaboration between users on the visualized data in extended reality can combine the analytic power of multiple individuals, and potentially leading to increased quality of solutions and discoveries. The work presented in this paper discusses a remote collaboration technique for enhancing collaboration on visualized data in Augmented Reality. This was done through allowing the user to be immersed to a certain extent, but not completely replacing their reality. The Microsoft Hololens was used to create an Augmented Reality application that transfers the movements of the remote users in real-time using Microsoft Kinect v2 in the form of a hologram of an avatar. This allowed multiple participants to see each other (embodied as avatars), collaborate and interact with 3-Dimension visualized data as shareable holograms between the remote users. An experiment was conducted on 14 participants. The results indicated that the application was useful and fulfills the requirement. We found that the application successfully provided a rich, interesting, and immersive collaborative experience for the students regarding remote collaboration on data visualization in extended reality.},

  urldate = {2024-07-31},
  abstract = {Remote collaboration systems allow users at different sites to perform joint tasks, which are required by many real-life applications. For example, environmental pollution is a complex problem requiring many kinds of expertise to fully understand, as pollutants disperse not only locally but also regionally or even globally. This paper presents a remote collaborative visualization system through providing co-presence, information sharing, and collaborative analysis functions based on mixed reality techniques. We start with developing an immersive visualization approach for analyzing multi-attribute and geo-spatial data with intuitive multi-model interactions, simulating co-located collaboration effects. We then go beyond by designing a set of information sharing and collaborative analysis functions to support different users to share and analyze their sensemaking processes collaboratively. We provide example results and usage scenario to demonstrate that our system enables users to perform a variety of immersive and collaborative analytics tasks effectively. Through two small user studies focusing on evaluating our design of information sharing and system usability, the evaluation results confirm the effectiveness of comprehensive sharing among user, data, physical, and interaction spaces for improving remote collaborative analysis experience.},

  urldate = {2024-04-19},
  abstract = {This paper investigates the effect of using augmented reality (AR) annotations and two different gaze visualizations, head pointer (HP) and eye gaze (EG), in an AR system for remote collaboration on physical tasks. First, we developed a spatial AR remote collaboration platform that supports sharing the remote expert's HP or EG cues. Then the prototype system was evaluated with a user study comparing three conditions for sharing non-verbal cues: (1) a cursor pointer (CP), (2) HP and (3) EG with respect to task performance, workload assessment and user experience. We found that there was a clear difference between these three conditions in the performance time but no significant difference between the HP and EG conditions. When considering the perceived collaboration quality, the HP/EG interface was statistically significantly higher than the CP interface, but there was no significant difference for workload assessment between these three conditions. We used low-cost head tracking for the HP cue and found that this served as an effective referential pointer. This implies that in some circumstances, HP could be a good proxy for EG in remote collaboration. Head pointing is more accessible and cheaper to use than more expensive eye-tracking hardware and paves the way for multi-modal interaction based on HP and gesture in AR remote collaboration.},

  booktitle = {2018 {{IEEE International Symposium}} on {{Mixed}} and {{Augmented Reality Adjunct}} ({{ISMAR-Adjunct}})},

  urldate = {2024-07-18},
  abstract = {Shared spaces for remote collaboration are nowadays possible by considering a variety of users, devices, immersion systems, interaction capabilities, navigation paradigms, etc. There is a substantial amount of research done in this line, proposing different solutions. However, still a more general solution that considers the heterogeneity of the involved actors/items is lacking. In this paper, we present MIME, a mixed-space tri-collaborative system. Differently from other mixed-space systems, MIME considers three different types of users (in different locations) according to the level of immersion in the system, who can interact simultaneously -- what we call a tri-collaboration. For the three types, we provide a solution to navigate, point at objects/locations and make annotations, while users are able to see a virtual representation of the rest of users. Additionally, the total number of users that can simultaneously interact with the system is only restricted by the available hardware, i.e., various users of the same type can be simultaneously connected to the system. We have conducted a preliminary study at the laboratory level, showing that MIME is a promising tool that can be used in many real cases for different purposes.},

}`,DOI:"10.1109/ISMAR-Adjunct.2018.00062","Use Case: Task/Task Type":["Problem Solving & Games","Communication & Collaboration"],"Use Case: Domain":["Education & Knowledge Work"],"Study Task":["training, instruction, guiding"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":["scalability","heterogeneity & interoperability"],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":["general - user representation & techniques"],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":["user representation"],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2019",Authors:["Sebastian Utzig","Robert Kaps","Syed Muhammad Azeem","Andreas Gerndt"],Name:"Augmented Reality for Remote Collaboration in Aircraft Maintenance Tasks",Bibtex:`@inproceedings{utzig2019augmented,

  urldate = {2024-09-06},
  abstract = {In this paper, we present a concept study to facilitate maintenance of an operating aircraft based on its lifelong collected data, called Digital Twin. It demonstrates a damage assessment scenario on a real aircraft component. We propose a graphical user interface that contains menu-guided instructions and inspection documentation to increase the efficiency of manual processes. Furthermore, experts located at different sites can join via a virtual session. By inspecting a 3D model of the aircraft component, they can see synchronized information from a Digital Twin database. With Augmented Reality glasses, the Microsoft HoloLens, a Digital Twin can be experienced personally. In the inspector's view, the 3D model of the Digital Twin is directly superimposed on the physical component. This Mixed Reality Vision can be used for inspection purposes. Any inspection related information can be directly attached to the component. For example, damage locations are marked by the inspector on the component's surface and are stored in the Digital Twin database. Our scenario demonstrates how new information can be derived from the combination of collected data and analyses from the Digital Twin database. This information is used to maintain the continued airworthiness of the aircraft. Feedback from domain related engineers confirm that our interface has an enormous potential for solving current maintenance problems in the aviation industry. Additionally, our study provides ideas for the integration of further analysis functions into the interface.},

  booktitle = {2023 {{IEEE International Symposium}} on {{Mixed}} and {{Augmented Reality Adjunct}} ({{ISMAR-Adjunct}})},

  urldate = {2024-04-22},
  abstract = {Extended Reality (XR) has gained significant attention, offering novel pathways for learning based on the sharing of 3D content. Nevertheless, additional efforts should be spent to understand the advantages set forth by Cross-Reality (CR) scenarios, for example including Augmented Reality (AR) and Mixed Reality (MR) experiences in the context of remote live-streaming classes. In this process, a necessary step entails designing, implementing, and making educational tools available in an open-source format. To this aim, we present HOCTOPUS, a CR system designed to support live remote teaching. HOCTOPUS provides a cross-reality educational experience: an MR application for teachers and an AR mobile app for students. HOCTOPUS lets teachers visualize, manipulate, and share 3D objects in a live-streaming fashion, supporting bidirectional communication and interactions with all students. The MR component is developed for the Hololens 2, offering flexible manipulation capabilities, while the AR component runs on Android mobile devices, providing affordable interactive visualization and manipulation. The proposed tool may be used as a building block to enhance the learning process and is made available to the educational community for its use, assessment, and extension.},

}`,DOI:"10.1109/ISMAR-Adjunct60411.2023.00014","Use Case: Task/Task Type":["Instruction & Guidance"],"Use Case: Domain":["Education & Knowledge Work"],"Study Task":["no study"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":["general - system complexity"],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":["annotations"],"evaluation & studies":[],"domain & use case specific":["domain & use case specific"],"data privacy & security":[]},{Year:"2023",Authors:["Faisal Zaman","Craig Anslow","Andrew Chalmers","Taehyun Rhee"],Name:"MRMAC: Mixed Reality Multi-user Asymmetric Collaboration",Bibtex:`@inproceedings{zaman2023mrmac,

  author = {Zaman, Faisal and Anslow, Craig and Chalmers, Andrew and Rhee, Taehyun},
  year = {2023},
  month = oct,
  doi = {10.1109/ISMAR59233.2023.00074},
  abstract = {We present MRMAC, a Mixed Reality Multi-user Asymmetric Collaboration system that allows remote users to teleport virtually into a real-world collaboration space to communicate and collaborate with local users. Our system provides telepresence for remote users by live-streaming the physical environment of local users using a 360-degree camera while blending 3D virtual assets into the mixed-reality collaboration space. Our novel client-server architecture enables asymmetric collaboration for multiple AR and VR users with avatars, view controls, and synchronized low-latency audio, video, and asset streaming. We evaluated our implementation with two baseline conditions: conventional 2D videoconferencing and standard 360-degree videoconferencing. Results show that MRMAC outperformed both baselines in inducing a sense of presence, improving task performance, usability, and overall user preference, demonstrating its potential for immersive multi-user telecollaboration.},

  booktitle = {2016 {{IEEE Third VR International Workshop}} on {{Collaborative Virtual Environments}} ({{3DCVE}})},

  urldate = {2024-09-12},
  abstract = {Increasing networking performances as well as the emergence of Mixed Reality (MR) technologies make possible providing advanced interfaces to improve remote collaboration. In this paper, we present our novel interaction paradigm called Vishnu that aims to ease collaborative remote guiding. We focus on collaborative remote maintenance as an illustrative use case. It relies on an expert immersed in Virtual Reality (VR) in the remote workspace of a local agent helped through an Augmented Reality (AR) interface. The main idea of the Vishnu paradigm is to provide the local agent with two additional virtual arms controlled by the remote expert who can use them as interactive guidance tools. Many challenges come with this: collocation, inverse kinematics (IK), the perception of the remote collaborator and gestures coordination. Vishnu aims to enhance the maintenance procedure thanks to a remote expert who can show to the local agent the exact gestures and actions to perform. Our pilot user study shows that it may decrease the cognitive load compared to a usual approach based on the mapping of 2D and de-localized informations, and it could be used by agents in order to perform specific procedures without needing to have an available local expert.},

  urldate = {2024-09-05},
  abstract = {For decades, people have been creating new ways to make remote communication and collaboration natural and effective. Recently, eXtended Reality (XR)-based remote collaborations enable people around the world to communicate in real-time in a mixed physical and virtual space, which breaks the limitations of geography. 5G mobile networks are considered as the enabling communication technology toward XR and metaverse, but the network demands of remote real-time collaborations in metaverse and how real-world 5G can support these applications have not been studied in depth. In this work, we introduce remote collaboration technologies and evaluate the network characteristics of remote real-time collaboration in metaverse under the 5G mobile network. Based on our evaluation results, challenges and opportunities are discussed.},

  abstract = {This work proposes the use of immersive asymmetric collaboration as an assistive technology for people who are blind or visually impaired (BVI). Similar to tele-guidance (TG) systems, it is feasible to transmit in-situ spatial information from the perspective of a BVI person wearing an Augmented Reality (AR) headset to be viewed by a remote sighted person wearing a Virtual Reality (VR) headset. Through this asymmetric collaborative guidance scenario, we expect remote guides may have better spatial understanding of the environment, being immersed in its digital twin, while BVI users may find guidance to be less time-consuming in their current environment, when compared to current TG systems, solely based on video. In the current experiment, TG is done in a Wizard-of-Oz fashion, while users (N = 18) are blindfolded and follow its audio cues in search of targets in a room. Results outlined that different audio interfaces have an impact on the system's usability, with one of our tested methods providing significantly better results in multiple usability metrics. As a proof of concept, we showcase how cross-reality asymmetric collaboration can be used in day-to-day manual tasks, such as finding objects in a pantry or a closet.},

  author = {Rebol, Manuel and Pietroszek, Krzysztof and Ranniger, Claudia and Hood, Colton and Rutenberg, Adam and Sikka, Neal and Li, David and G{\\"u}tl, Christian},

  urldate = {2024-02-13},
  abstract = {Medical procedures are an essential part of healthcare delivery, and the acquisition of procedural skills is a critical component of medical education. Unfortunately, procedural skill is not evenly distributed among medical providers. Skills may vary within departments or institutions, and across geographic regions, depending on the provider's training and ongoing experience. We present a mixed reality real-time communication system to increase access to procedural skill training and to improve remote emergency assistance. Our system allows a remote expert to guide a local operator through a medical procedure. RGBD cameras capture a volumetric view of the local scene including the patient, the operator, and the medical equipment. The volumetric capture is augmented onto the remote expert's view to allow the expert to spatially guide the local operator using visual and verbal instructions. We evaluated our mixed reality communication system in a study in which experts teach the ultrasound-guided placement of a central venous catheter (CVC) to students in a simulation setting. The study compares state-of-the-art video communication against our system. The results indicate that our system enhances and offers new possibilities for visual communication compared to video teleconference-based training.},

  abstract = {We present our work in progress, a real-time mixed reality communication system for remote assistance in medical emergency situations. 3D cameras capture the emergency situa-tion and send volumetric data to a remote expert. The remote expert sees the volumetric scene through mixed reality glasses and guides an operator at the patient. The local operator receives audio and visual guidance augmented onto the mixed reality headset. We compare the mixed reality system against traditional video communication in a user study on a CPR emergency simulation. We evaluate task performance, cognitive load, and user interaction. The results will help to better understand the benefits of using augmented and volumetric information in medical emergency procedures.},

  urldate = {2024-07-17},
  abstract = {The recent advances in Virtual Reality (VR) and Augmented Reality (AR) research have enabled investigations into collaborative efforts that equip participants with heterogeneous technological configurations in various degrees of immersion. Results from this work are interesting and may seem futuristic which can cause challenges in understanding the underlying impacts and gaining insights. This paper describes an attempt in identifying the fundamental elements of a digital interaction and remote collaboration; and proposes the Cross Reality Collaboration Framework (CRCF) to provide a unified platform for discussing, comparing, and contrasting these efforts. Though in an early stage of development, the current iteration of CRCF is capable of analyzing configurations that are based on drastically different technologies (e.g., an AR application vs. a location aware mobile application), comparing them, and revealing insights. This paper demonstrates the potentials of CRCF by applying it to analyze popular technological configurations and identifying opportunities for investigations. The paper then describes a prototype solution addressing the identified opportunity and presents results from a testing environment involving four collaborators with distinct technological configurations.},

  title = {Designing a {{Multi-Modal Communication System}} for the {{Deaf}} and {{Hard-of-Hearing Users}}},
  booktitle = {2021 {{IEEE International Symposium}} on {{Mixed}} and {{Augmented Reality Adjunct}} ({{ISMAR-Adjunct}})},

  doi = {10.1109/ISMAR-Adjunct54149.2021.00097},
  urldate = {2024-04-22},
  abstract = {In remote collaboration using Augmented Reality (AR), speech and gesture are major communication methods for the general public. However, the Deaf and Hard-of-Hearing (DHH) population cannot join in the communication due to the absence of a sign language interface which is their primary language. Recent works have tried to augment spoken language with sign language animations or captions, but the research to convey sign language with spoken language is still very limited. In this paper, we propose a novel multi-modal communication system that integrates sign language translation, speech recognition, and shared object manipulation in the mobile AR environment. Though the system is currently under development, we demonstrated a rapid prototype of the telemedicine app leveraging the video prototyping method to integrate the system modules. We performed preliminary interviews about our approach with DHH users, a sign language interpreter, and a physician. We discuss the insights into the future design of the DHH communication support in the AR collaboration system. This study has a socio-cultural, economic impact on the DHH population as a barrier-free design of a remote collaboration system in a practical scenario. Another contribution of this work is that we suggested a novel user-centered system for DHH users in AR by integrating the existing technologies.},

  title = {Health-{{5G}}: {{A Mixed Reality-Based System}} for {{Remote Medical Assistance}} in {{Emergency Situations}}},

  author = {Garc{\\'i}a, Francisco M. and Moraleda, Rub{\\'e}n and {Schez-Sobrino}, Santiago and Monekosso, Dorothy N. and Vallejo, David and {Glez-Morcillo}, Carlos},

  urldate = {2024-04-22},
  abstract = {Mixed reality is the combination of virtual and augmented reality to interactively and believably merge physical and computer-generated environments. This paper discusses the design of Health-5G, a scalable mixed reality-based system that facilitates and supports emergency response by medical emergency teams. Health-5G is supported by a distributed architecture divided into four interrelated applications responsible for advanced computer-human interaction, effective real-time videoconference, medical device integration, and communication infrastructure, respectively. The mixed reality layer is provided by the headset Microsoft Hololens 2™. Health-5G is based on scenarios in which emergency personnel wear mixed reality glasses that can transmit audio, video, and data streams bidirectionally over a 5G network to medical specialists stationed in a hospital at any distance. Thanks to Health-5G, the specialist will be able to access the emergency team's point of view at any time and provide verbal and visual instructions, including gestures and positioning of graphical markers in 3D space. In this way, emergency personnel can provide the best possible care to the patient without having to wait for them to arrive at the hospital, saving a lot of time in scenarios where every second can make a difference. Health-5G also addresses the integration of medical devices and the collection of the patient's medical data in a scalable way through optical character recognition. A case study is discussed where Health-5G is used to attend a patient in the street suffering from syncope due to third-degree atrioventricular block. Latency and performance tests over a 5G network are also discussed. To the best of our knowledge, there is no comprehensive solution in the literature that provides all the capabilities offered by Health-5G in terms of functionality and advanced interaction mechanisms within the context of remote, immersive support in emergency situations.},

}`,DOI:"10.1109/ACCESS.2023.3285420","Use Case: Task/Task Type":["Instruction & Guidance"],"Use Case: Domain":["(Tele) Medicine"],"Study Task":["no study"],"device limitations":["tracking","ergonomics"],"scene acquisition & reconstruction":[],"user acquisition & modelling":["hand tracking"],"system complexity":["scalability"],"latency & real-time presentation":["network challenges","bandwidth issue","general latency"],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":["evaluation & studies"],"domain & use case specific":["domain & use case specific"],"data privacy & security":["data privacy & security"]},{Year:"2020",Authors:["Boram Yoon","Hyung-il Kim","Seo Young Oh","Woontack Woo"],Name:"Evaluating Remote Virtual Hands Models on Social Presence in Hand-based 3D Remote Collaboration",Bibtex:`@inproceedings{yoon2020evaluating,

  urldate = {2024-04-19},
  abstract = {This study investigates the effects of a virtual hand representation on the user experience including social presence during hand-based 3D remote collaboration. Although a remote hand appearance is a critical parts of a hand-based telepresence, it has been rarely studied in comparison to studies on the self-embodiment of virtual hands in a 3D environment. Thus, we conducted a user study comparing the three virtual hands models (Skeleton, Low Polygon and Realistic) while performing a remote collaborative task based on the American Sign Language (ASL) using both Augmented Reality (AR) and Virtual Reality (VR) environments. We found that the realistic type was perceived as the most sense of being together, human-like, and trustable representation. The low polygon model could also convey a clear sign and moderate level of social presence. Although the system was configured asymmetrically in AR and VR, little difference in perception was found except for the participant's mental load and message understanding. We then discuss the results and suggest design implications for future hand-based 3D telepresence systems.},

  abstract = {We present a volumetric communication system that is designed for remote assistance of procedural tasks. The system allows a remote expert to visually guide a local operator. The two parties share a view that is spatially identical, but for the local operator it is of the object on which they operate, while for the remote expert, the object is presented as a mixed reality "hologram". Guidance is provided by voice, gestures, and annotations performed directly on the object of interest or its hologram. At each end of the communication, spatial is visualized using mixed-reality glasses.},

}`,DOI:"10.1109/VRW52623.2021.00209","Use Case: Task/Task Type":["Instruction & Guidance"],"Use Case: Domain":["Maintenance & Industry"],"Study Task":["no study"],"device limitations":[],"scene acquisition & reconstruction":["general - scene acquisition & reconstruction"],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":["general - latency & real-time presentation","general latency"],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2023",Authors:["Guillaume Bataille","Abdelhadi Lammini","Jean-R{\\'e}my Chardonnet"],Name:"ARPuzzle: Evaluating the Effectiveness of Collaborative Augmented Reality",Bibtex:`@inproceedings{bataille2023arpuzzle,
  title = {{{ARPuzzle}}: {{Evaluating}} the {{Effectiveness}} of {{Collaborative Augmented Reality}}},
  shorttitle = {{{ARPuzzle}}},
  booktitle = {2023 {{IEEE International Symposium}} on {{Mixed}} and {{Augmented Reality}} ({{ISMAR}})},
  author = {Bataille, Guillaume and Lammini, Abdelhadi and Chardonnet, Jean-R{\\'e}my},

  publisher = {IEEE Computer Society},
  doi = {10.1109/ISMAR59233.2023.00079},
  urldate = {2024-02-09},
  abstract = {Collaborative Augmented Reality (CAR) offers disruptive ways for people to collaborate. However, this emerging technology must improve its acceptance, efficiency, and usability to scale up and, for example, support augmented operations executed by technicians. This paper presents our CAR system and its experimentation during a cooperative puzzle-solving task. Our system provides collaborators with a shared virtual space allowing verbal and non-verbal interpersonal communications, and intuitive interactions with shared virtual replicas of real objects. Our system also integrates avatars embodied by remote users. We conducted a dual-user study comparing colocated and remote solving of a puzzle virtual replica with its real solving. We evaluated task performance, collaboration, mutual awareness, spatial presence, and copresence, usability, and preference. We found that, if real is preferred and more efficient than our CAR system, CAR is reaching favorable usability levels. We also found that remote augmented reality including full-body avatars offers similar results to colocated augmented reality. This preliminary work paves the way for future research aiming to support and enhance the design and making of Collaborative Augmented Reality systems dedicated to augmented operations.},

}`,DOI:"10.1109/ISMAR59233.2023.00079","Use Case: Task/Task Type":["Problem Solving & Games"],"Use Case: Domain":["Social & Play"],"Study Task":["puzzle and assembly"],"device limitations":["tracking","display"],"scene acquisition & reconstruction":[],"user acquisition & modelling":["hand tracking"],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2024",Authors:["Lovis Schwenderling","Wilhelm Herbrich","Fabian Joeres","Christian Hansen"],Name:"A Novel Framework for Hand Visualization in Web-Based Collaborative XR",Bibtex:`@inproceedings{schwenderling2024novela,
  title = {A {{Novel Framework}} for {{Hand Visualization}} in {{Web-Based Collaborative XR}}},
  booktitle = {2024 {{IEEE Conference}} on {{Virtual Reality}} and {{3D User Interfaces Abstracts}} and {{Workshops}} ({{VRW}})},
  author = {Schwenderling, Lovis and Herbrich, Wilhelm and Joeres, Fabian and Hansen, Christian},
  year = {2024},
  month = mar,
  pages = {18--23},
  doi = {10.1109/VRW62533.2024.00010},
  urldate = {2024-09-05},
  abstract = {Many extended reality (XR) applications are platform-specific, making accessibility and cross-platform collaboration difficult. Web-based collaborative XR can enhance adoption of XR technologies, using the browser as a platform-independent interface. However, challenges arise from the browser environment, such as performance limitations. To this end, we present a WebXR-based framework for hand interaction in cross-platform collaboration in XR. A network structure and methods for collaborative and individual object manipulation complement the integrated hand tracking. Three different fidelity levels to represent the hands of remote users were implemented to accommodate different performance capabilities. Concepts ranged from virtual hands to discrete poses with abstract objects. A sample application was implemented with a puzzle task. Two users collaborated in the browsers of the Microsoft HoloLens 2 and the Meta Quest 2. Qualitative and quantitative data on user performance (n=9), and frame rate recordings (n=1) were collected. All users were able to solve the puzzle together quickly and intu-itively. The Quest environment was preferred, as there were more performance issues with the HoloLens. Hand interaction was well-received and proved to be sufficient as the only form of communication. Simpler representations of the hands lead to a higher frame rate, whereby the effects were device-dependent. The impact on task performance was low. Hand interaction enables an intuitive exchange of objects and basic communication in cross-platform collaboration via browsers. Depending on the XR environment, however, device-specific performance limitations must be taken into account by modulating the amount of data and rendering effort.},

  urldate = {2024-04-23},
  abstract = {For many applications, remote guidance and telerobotics provide great advantages. For example, tele-ultrasound can bring much-needed expert healthcare to isolated communities. However, existing tele-guidance methods have serious limitations. A new concept called human teleoperation leverages mixed reality, haptics, and high-speed communication to provide tele-guidance that is more tightly coupled than existing methods yet more accessible than telerobotics. This paper provides an overview of the human teleoperation concept and its application to tele-ultrasound. The concept and its impact are discussed, the graphics, communications, controls, and haptics subsystems are explained, and results are presented that show the system's efficacy. These include tests of the communication architecture, of human performance in tracking mixed reality signals, and of human teleoperation in a limited clinical use-case. The results show good potential for teleultrasound, as well as possible other applications of human teleoperation including remote maintenance, inspection, and training.},

  abstract = {In this poster, we present a digital twin-based mixed reality system for remote collaboration with the size-scaling of the user and the space. The proposed system supports collaboration between an AR host user and a VR remote user by sharing a 3D digital twin of the AR host user. To enhance the coarse authoring of a shared digital twin environment, we provide a size scaling of the digital twin environment with the world-in-miniature view. Also, we enable scaling the size of the VR user's avatar to enhance both coarse (size-up) and fine-grained (size-down) authoring of the digital twin environment. We describe the system setup, input methods, and interaction methods for scaling space and user.},

  urldate = {2024-07-31},
  abstract = {In this paper, we present a 360{$^\\circ$} panoramic Mixed Reality (MR) sys-tem that visualises shared gaze cues using contextual speech input to improve task coordination. We conducted two studies to evaluate the design of the MR gaze-speech interface exploring the combinations of visualisation style and context control level. Findings from the first study suggest that an explicit visual form that directly connects the collaborators' shared gaze to the contextual conversation is preferred. The second study indicates that the gaze-speech modality shortens the coordination time to attend to the shared interest, making the communication more natural and the collaboration more effective. Qualitative feedback also suggest that having a constant joint gaze indicator provides a consistent bi-directional view while establishing a sense of co-presence during task collaboration. We discuss the implications for the design of collaborative MR systems and directions for future research.},

  urldate = {2024-04-22},
  abstract = {In a one-to-many mixed reality collaboration environment, where multiple local users wearing AR headsets are supervised by a remote expert wearing a VR HMD, we evaluated three view-sharing techniques: 2D video, 360 video, and 3D model augmented with 2D video. Through a pilot test, the weaknesses of the techniques were identified, and additional features were integrated into them. Then, their performances were compared in two different collaboration scenarios based on search and assembling. In the first scenario, a local user performed both search and assembling. In the second scenario, two local users had dedicated roles, one for search and the other for assembling. The experiment results showed that the 3D model augmented with 2D video was time-efficient, usable, less demanding and most preferred in one-to-many mixed reality collaborations.},

  urldate = {2024-09-05},
  abstract = {This paper explores the application of Digital Twins (DTs) and eXtended Reality (XR) in the context of Industry 4.0, and investigates new ways in which these technologies can be used in remote assistance/training scenarios involving Collaborative Robots (CRs). The study builds upon a previous work that examined the suitability of a novel DT/XR-based telepresence platform for CR programming in terms of network capabilities. The present work addresses some of the limitations of the previous study in the context of a new use case, integrating human pose estimation and object tracking to enhance the DT functionalities of the platform, and testing it in a riveting task scenario. The results in terms of bandwidth and latencies obtained in a laboratory setup emulating 6G performance show the potential of DTs and XR in supporting the collaboration of distant human operators and CRs over future mobile networks, paving the way for the development of new services for next-generation industry.},

  title = {A {{Mixed Reality Telepresence System}} for {{Collaborative Space Operation}}},
  author = {Fairchild, Allen J. and Campion, Simon P. and Garc{\\'i}a, Arturo S. and Wolff, Robin and Fernando, Terrence and Roberts, David J.},

  doi = {10.1109/TCSVT.2016.2580425},
  urldate = {2024-09-06},
  abstract = {This paper presents a mixed reality (MR) system that results from the integration of a telepresence system and an application to improve collaborative space exploration. The system combines free viewpoint video with immersive projection technology to support nonverbal communication (NVC), including eye gaze, interpersonal distance, and facial expression. Importantly, these features can be interpreted together as people move around the simulation, maintaining a natural social distance. The application is a simulation of Mars, within which the collaborators must come to agreement over; for example, where the Rover should land and go. The first contribution is the creation of an MR system supporting contextualization of NVC. Two technological contributions are prototyping a technique to subtract a person from a background that may contain physical objects and/or moving images and a lightweight texturing method for multiview rendering, which provides balance in terms of visual and temporal quality. A practical contribution is the demonstration of pragmatic approaches to sharing space between display systems of distinct levels of immersion. A research tool contribution is a system that allows comparison of conventional authored and video-based reconstructed avatars, within an environment that encourages exploration and social interaction. Aspects of system quality, including the communication of facial expression and end-to-end latency are reported.},

}`,DOI:"10.1109/TCSVT.2016.2580425","Use Case: Task/Task Type":["Problem Solving & Games","Communication & Collaboration","Instruction & Guidance"],"Use Case: Domain":["Maintenance & Industry","Education & Knowledge Work"],"Study Task":["no study"],"device limitations":["tracking"],"scene acquisition & reconstruction":["general object recognition & alignment","3D reconstruction","point cloud completeness"],"user acquisition & modelling":["face & gaze tracking","general - user acquisition & modelling"],"system complexity":["general - system complexity","heterogeneity & interoperability","devices & sensors"],"latency & real-time presentation":["network challenges","general latency"],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":["avatar designs & uncanny valley","level of detail & accuracy","general - user representation & techniques"],"communication & sensory feedback":["non-verbal","facial expressions & eyes"],"interpersonal awareness":["gaze & view sharing"],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2023",Authors:["Krzysztof Adam Szczurek","Raul Marin Prades","Eloise Matheson","Jose {Rodriguez-Nogueira}","Mario Di Castro"],Name:"Multimodal Multi-User Mixed Reality Human–Robot Interface for Remote Operations in Hazardous Environments",Bibtex:`@article{szczurek2023multimodal,
  title = {Multimodal {{Multi-User Mixed Reality Human}}--{{Robot Interface}} for {{Remote Operations}} in {{Hazardous Environments}}},
  author = {Szczurek, Krzysztof Adam and Prades, Raul Marin and Matheson, Eloise and {Rodriguez-Nogueira}, Jose and Castro, Mario Di},
