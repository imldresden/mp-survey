  abstract = {We present an end-to-end system for augmented and virtual reality telepresence, called Holoportation. Our system demonstrates high-quality, real-time 3D reconstructions of an entire space, including people, furniture and objects, using a set of new depth cameras. These 3D models can also be transmitted in real-time to remote users. This allows users wearing virtual or augmented reality displays to see, hear and interact with remote participants in 3D, almost as if they were present in the same physical space. From an audio-visual perspective, communicating and interacting with remote users edges closer to face-to-face communication. This paper describes the Holoportation technical system in full, its key interactive capabilities, the application scenarios it enables, and an initial qualitative study of using this new communication medium.},

}`,DOI:"10.1145/2993369.2996318","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Maintenance & Industry"],"Study Task":["no study"],"device limitations":[],"scene acquisition & reconstruction":["3D reconstruction"],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2016",Authors:["Lei Gao","Huidong Bai","Gun Lee","Mark Billinghurst"],Name:"An oriented point-cloud view for MR remote collaboration",Bibtex:`@inproceedings{gao2016oriented,

  urldate = {2024-07-17},
  abstract = {We present a Mixed Reality system for remote collaboration using Virtual Reality (VR) headsets with external depth cameras attached. By wirelessly sharing a 3D point-cloud data of a local workers' workspace with a remote helper, and sharing the remote helper's hand gestures back to the local worker, the remote helper is able to assist the worker to perform manual tasks.Displaying the point-cloud video in a conventional way, such as a static front view in VR headsets, does not provide helpers with sufficient understanding of the spatial relationships between their hands and the remote surroundings. In contrast, we propose a Mixed Reality (MR) system that shares with the remote helper, not only 3D captured environment data but also real-time orientation info of the worker's viewpoint. We conducted a pilot study to evaluate the usability of the system, and we found that extra synchronized orientation data can make collaborators feel more connected spatially and mentally.},

}`,DOI:"10.1145/2999508.2999531","Use Case: Task/Task Type":["Assembly & Arrangement","Instruction & Guidance"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["puzzle and assembly"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":["communication about the environment"],"user representation & techniques":[],"communication & sensory feedback":["facial expressions & eyes","gestures"],"interpersonal awareness":["gaze & view sharing"],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2016",Authors:["Hongling Sun","Zhenliang Zhang","Yue Liu","Henry B. L. Duh"],Name:"OptoBridge: assisting skill acquisition in the remote experimental collaboration",Bibtex:`@inproceedings{sun2016optobridge,

  booktitle = {Proceedings of the 28th {{Australian Conference}} on {{Computer-Human Interaction}}},

  urldate = {2024-09-08},
  abstract = {In this paper an experimental teaching platform named OptoBridge is presented which supports the sharing of the collaborative space for spatially distributed users to assist skill acquisition. The development of OptoBridge is based on augmented reality (AR) and integrates free-hand gesture interactions with the video mediated communication. The prototype is preliminarily applied in the optics field to promote skill execution in the case of the Michelson interferometer. OptoBridge enables the remote teacher to monitor the experimental scenario as well as the detailed optical phenomena through the transmitted video captured on the local side. Meanwhile the local learner equipped with the optical see-through head-mounted display (OSTHMD) can be indicated by virtual hands and augmented annotations controlled by the teacher's gestures and follow the guidance to get their skills practiced. The implementation of OptoBridge is also presented, aimed at providing a more engaging and efficient approach for remote skill teaching.},
  isbn = {978-1-4503-4618-4}
}`,DOI:"10.1145/3010915.3010975","Use Case: Task/Task Type":["Instruction & Guidance"],"Use Case: Domain":["Maintenance & Industry"],"Study Task":["puzzle and assembly"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":["hand tracking"],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":["general - spatial consistency"],"shared & blended environment":["virtual content positioning"],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":["gestures"],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2017",Authors:["Jens M{\\u}ller","Roman R{\\a}dle","Harald Reiterer"],Name:"Remote Collaboration With Mixed Reality Displays: How Shared Virtual Landmarks Facilitate Spatial Referencing",Bibtex:`@inproceedings{muller2017remote,
  title = {Remote {{Collaboration With Mixed Reality Displays}}: {{How Shared Virtual Landmarks Facilitate Spatial Referencing}}},
  booktitle = {Proceedings of the 2017 {{CHI Conference}} on {{Human Factors}} in {{Computing Systems}}},
  author = {M{\\"u}ller, Jens and R{\\"a}dle, Roman and Reiterer, Harald},
  year = {2017},

  pages = {6481--6486},
  publisher = {Association for Computing Machinery},
  address = {New York, NY, USA},
  doi = {10.1145/3025453.3025717},
  abstract = {HCI research has demonstrated Mixed Reality (MR) as being beneficial for co-located collaborative work. For remote collaboration, however, the collaborators' visual contexts do not coincide due to their individual physical environments. The problem becomes apparent when collaborators refer to physical landmarks in their individual environments to guide each other's attention. In an experimental study with 16 dyads, we investigated how the provisioning of shared virtual landmarks (SVLs) influences communication behavior and user experience. A quantitative analysis revealed that participants used significantly less ambiguous spatial expressions and reported an improved user experience when SVLs were provided. Based on these findings and a qualitative video analysis we provide implications for the design of MRs to facilitate remote collaboration.},
  isbn = {978-1-4503-4655-9},
  keywords = {mixed reality,remote collaboration,virtual landmarks}

  urldate = {2024-07-17},
  abstract = {In this paper, we explore techniques for enhancing remote Mixed Reality (MR) collaboration in terms of communication and interaction. We created CoVAR, a MR system for remote collaboration between an Augmented Reality (AR) and Augmented Virtuality (AV) users. Awareness cues and AV-Snap-to-AR interface were proposed for enhancing communication. Collaborative natural interaction, and AV-User-Body-Scaling were implemented for enhancing interaction. We conducted an exploratory study examining the awareness cues and the collaborative gaze, and the results showed the benefits of the proposed techniques for enhancing communication and interaction.},

}`,DOI:"10.1145/3132787.3139200","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["object arrangement and manipulation","locating object in environment"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":["content & intention sharing","general - interpersonal awareness"],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2017",Authors:["Jens M{\\u}ller","Simon Butscher","Stefan P. Feyer","Harald Reiterer"],Name:"Studying collaborative object positioning in distributed augmented realities",Bibtex:`@inproceedings{muller2017studying,

  author = {M{\\"u}ller, Jens and Butscher, Simon and Feyer, Stefan P. and Reiterer, Harald},
  year = {2017},

  pages = {123--132},
  publisher = {Association for Computing Machinery},
  address = {New York, NY, USA},
  doi = {10.1145/3152832.3152856},
  abstract = {Augmented Reality (AR) displays have been suggested as shared-space technology to support remote collaboration, e.g., in design and building tasks. But with AR displays, the shared space typically consists of only the virtual work objects (e.g., design artifacts) while collaborators' interaction is grounded in their individual, physical environment. This can become problematic during activities that involve the positioning of virtual objects because the collaborators may require shared spatial references to coordinate their actions. In a lab experiment with 16 dyads, we studied how collaborators deal with that issue, and whether the provisioning of additive, virtual landmarks influences collaboration. As a result the landmarks improved user experience and decreased the reported temporal demand. In addition, we identified task-specific problem situations and provide implications for the design of distributed ARs to facilitate the collaborative positioning of virtual objects.},
  isbn = {978-1-4503-5378-6},
  keywords = {augmented reality,object positioning,remote collaboration,user experience,virtual landmarks}
}`,DOI:"10.1145/3152832.3152856","Use Case: Task/Task Type":["Problem Solving & Games"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["game"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":["dissimilar spaces"],"spatial awareness & orientation":["communication about the environment"],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":["general - interaction & UI design"],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2018",Authors:["Thammathip Piumsomboon","Gun A. Lee","Mark Billinghurst"],Name:"Snow Dome: A Multi-Scale Interaction in Mixed Reality Remote Collaboration",Bibtex:`@inproceedings{piumsomboon2018snow,

  urldate = {2024-07-17},
  abstract = {The digitalized world comes with increasing Internet capabilities, allowing to connect persons over distance easier than ever before. Video conferencing and similar online applications create great benefits bringing people who physically cannot spend as much time as they want virtually together. However, such remote experiences can also tend to lose the feeling of traditional experiences. People lack direct visual presence and no haptic feedback is available. In this paper, we tackle this problem by introducing our system called CheckMate. We combine Augmented Reality and capacitive 3D printed objects that can be sensed on an interactive surface to enable remote interaction while providing the same tangible experience as in co-located scenarios. As a proof-of-concept, we implemented a sample application based on the traditional chess game.},

  abstract = {We present Mini-Me, an adaptive avatar for enhancing Mixed Reality (MR) remote collaboration between a local Augmented Reality (AR) user and a remote Virtual Reality (VR) user. The Mini-Me avatar represents the VR user's gaze direction and body gestures while it transforms in size and orientation to stay within the AR user's field of view. A user study was conducted to evaluate Mini-Me in two collaborative scenarios: an asymmetric remote expert in VR assisting a local worker in AR, and a symmetric collaboration in urban planning. We found that the presence of the Mini-Me significantly improved Social Presence and the overall experience of MR collaboration.},

  doi = {10.1145/3266037.3266102},
  abstract = {In this paper we outline the design of a mixed-reality system to support object-focused remote collaboration. Here, being able to adjust collaborators' perspectives on the object as well as understand one another's perspective is essential to support effective collaboration over distance. We propose a low-cost mixed-reality system that allows users to: (1) quickly align and understand each other's perspective; (2) explore objects independently from one another, and (3) render gestures in the remote's workspace. In this work, we focus on the expert's role and we introduce an interaction technique allowing users to quickly manipulation 3D virtual objects in space.},

  urldate = {2024-07-18},
  abstract = {In this study we present a Mixed-Reality based mobile remote collaboration system that enables an expert providing real-time assistance over a physical distance. By using the Google ARCore position tracking, we can integrate the keyframes captured with one external depth sensor attached to the mobile phone as one single 3D point-cloud data set to present the local physical environment into the VR world. This captured local scene is then wirelessly streamed to the remote side for the expert to view while wearing a mobile VR headset (HTC VIVE Focus). In this case, the remote expert can immerse himself/herself in the VR scene and provide guidance just as sharing the same work environment with the local worker. In addition, the remote guidance is also streamed back to the local side as an AR cue overlaid on top of the local video see-through display. Our proposed mobile remote collaboration system supports a pair of participants performing as one remote expert guiding one local worker on some physical tasks in a more natural and efficient way in a large scale work space from a distance by simulating the face-to-face co-work experience using the Mixed-Reality technique.},

  doi = {10.1145/3281505.3281542},
  abstract = {Remote mixed reality (MR) collaboration systems allow for multimodal, real-time support from remote experts. We present our open toolkit that provides a flexible end-to-end solution for building such systems using off-the-shelf hardware. From related work, three core design aspects have been identified: 1) the independence of the viewpoint that the visitor (the remote expert) can take in relation to position and viewpoint of the visitee, 2) the immersiveness of the presentation technology for visitor and visitee, and 3) the extent to which the visitor's body is represented in the visitee's environment. This paper describes the implementation of our system, which includes these aspects. In a study aimed at validating whether we implemented these core aspects to good effect, conducted with a collaborative puzzle application built with our toolkit, we examine how variations of these aspects contribute to usability, performance and social presence related metrics.},

}`,DOI:"10.1145/3281505.3281542","Use Case: Task/Task Type":["Problem Solving & Games"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["object arrangement and manipulation","training, instruction, guiding","game","locating object in environment"],"device limitations":["display"],"scene acquisition & reconstruction":["general - scene acquisition & reconstruction","general object recognition & alignment"],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":["performance"],"spatial consistency":["calibration & alignment"],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2019",Authors:["Seungwon Kim","Gun Lee","Weidong Huang","Hayun Kim","Woontack Woo","Mark Billinghurst"],Name:"Evaluating the Combination of Visual Communication Cues for HMD-based Mixed Reality Remote Collaboration",Bibtex:`@inproceedings{kim2019evaluating,

  doi = {10.1145/3290605.3300403},
  abstract = {Many researchers have studied various visual communication cues (e.g. pointer, sketching, and hand gesture) in Mixed Reality remote collaboration systems for real-world tasks. However, the effect of combining them has not been so well explored. We studied the effect of these cues in four combinations: hand only, hand + pointer, hand + sketch, and hand + pointer + sketch, with three problem tasks: Lego, Tangram, and Origami. The study results showed that the participants completed the task significantly faster and felt a significantly higher level of usability when the sketch cue is added to the hand gesture cue, but not with adding the pointer cue. Participants also preferred the combinations including hand and sketch cues over the other combinations. However, using additional cues (pointer or sketch) increased the perceived mental effort and did not improve the feeling of co-presence. We discuss the implications of these results and future research directions.},

}`,DOI:"10.1145/3290605.3300403","Use Case: Task/Task Type":["Instruction & Guidance"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["object arrangement and manipulation","puzzle and assembly"],"device limitations":["display"],"scene acquisition & reconstruction":["3D reconstruction"],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":["non-verbal"],"interpersonal awareness":["content & intention sharing"],"cognition & presence":["co- & social-presence","cognitive & mental load"],"accessibility & inclusion":[],"asymmetric experiences":["content & environment sharing","interaction & general capabilities"],"interaction & UI design":["general - interaction & UI design","annotations"],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2019",Authors:["Theophilus Teo","Louise Lawrence","Gun A. Lee","Mark Billinghurst","Matt Adcock"],Name:"Mixed Reality Remote Collaboration Combining 360 Video and 3D Reconstruction",Bibtex:`@inproceedings{teo2019mixed,

  urldate = {2024-07-30},
  abstract = {Remote Collaboration using Virtual Reality (VR) and Augmented Reality (AR) has recently become a popular way for people from different places to work together. Local workers can collaborate with remote helpers by sharing 360-degree live video or 3D virtual reconstruction of their surroundings. However, each of these techniques has benefits and drawbacks. In this paper we explore mixing 360 video and 3D reconstruction together for remote collaboration, by preserving benefits of both systems while reducing drawbacks of each. We developed a hybrid prototype and conducted user study to compare benefits and problems of using 360 or 3D alone to clarify the needs for mixing the two, and also to evaluate the prototype system. We found participants performed significantly better on collaborative search tasks in 360 and felt higher social presence, yet 3D also showed potential to complement. Participant feedback collected after trying our hybrid system provided directions for improvement.},

  abstract = {We propose a multi-scale Mixed Reality (MR) collaboration between the Giant, a local Augmented Reality user, and the Miniature, a remote Virtual Reality user, in Giant-Miniature Collaboration (GMC). The Miniature is immersed in a 360-video shared by the Giant who can physically manipulate the Miniature through a tangible interface, a combined 360-camera with a 6 DOF tracker. We implemented a prototype system as a proof of concept and conducted a user study (n=24) comprising of four parts comparing: A) two types of virtual representations, B) three levels of Miniature control, C) three levels of 360-video view dependencies, and D) four 360-camera placement positions on the Giant. The results show users prefer a shoulder mounted camera view, while a view frustum with a complimentary avatar is a good visualization for the Miniature virtual representation. From the results, we give design recommendations and demonstrate an example Giant-Miniature Interaction.},

  abstract = {In this paper, we investigate hand gestures and visual annotation cues overlaid in a live 360 panorama-based Mixed Reality remote collaboration. The prototype system captures 360 live panorama video of the surroundings of a local user and shares it with another person in a remote location. The two users wearing Augmented Reality or Virtual Reality head-mounted displays can collaborate using augmented visual communication cues such as virtual hand gestures, ray pointing, and drawing annotations. Our preliminary user evaluation comparing these cues found that using visual annotation cues (ray pointing and drawing annotation) helps local users perform collaborative tasks faster, easier, making less errors and with better understanding, compared to using only virtual hand gestures.},

  urldate = {2023-06-13},
  abstract = {Supporting natural communication cues is critical for people to work together remotely and face-to-face. In this paper we present a Mixed Reality (MR) remote collaboration system that enables a local worker to share a live 3D panorama of his/her surroundings with a remote expert. The remote expert can also share task instructions back to the local worker using visual cues in addition to verbal communication. We conducted a user study to investigate how sharing augmented gaze and gesture cues from the remote expert to the local worker could affect the overall collaboration performance and user experience. We found that by combing gaze and gesture cues, our remote collaboration system could provide a significantly stronger sense of co-presence for both the local and remote users than using the gaze cue alone. The combined cues were also rated significantly higher than the gaze in terms of ease of conveying spatial actions.},

  urldate = {2024-07-30},
  abstract = {Handheld Augmented Reality (AR) displays offer a see-through option to create the illusion of virtual objects being integrated into the viewer's physical environment. Some AR display technologies also allow for the deactivation of the see-through option, turning AR tablets into Virtual Reality (VR) devices that integrate the virtual objects into an exclusively virtual environment. Both display configurations are typically available on handheld devices, raising the question of their influence on users' experience during collaborative activities. In two experiments, we studied how the different display configurations influence user experience, workload, and team performance of co-located and distributed collaborators during a spatial referencing task. A mixed-methods approach revealed that participants' opinions were polarized towards the two display configurations, regardless of the spatial distribution of collaboration. Based on our findings, we identify critical aspects to be addressed in future research to better understand and support co-located and distributed collaboration using AR and VR displays.},

  urldate = {2024-09-08},
  abstract = {With the availability of powerful and affordable Augmented Reality (AR) devices, scenarios have become popular in which people wearing AR devices are supported by remote experts. These experts often use 2D peripherals to access the video feed of the 3D head mounted device (HMD) and to augment it with verbal or digital information. This raises the question whether tools that work for these scenarios also work for remote consultations. We conducted a study to (re-)evaluate these tools in a furniture sales consultation context. We focused on the consultant side of these settings and explored how the use of different pointing methods and perspectives affect different situations during a consultation. For this, we developed and evaluated a prototype with ten furniture store workers. Initial results show that while most usability and task load scores were even, the participants reported clear favorites for certain settings. We use these results to derive design recommendations for similar future projects.},

  abstract = {In AR/MR remote collaboration, a remote expert often has to demonstrate tasks for a local worker. To make this easier, we have developed a new adaptive MR remote collaborative architecture which enables a remote expert to guide a local user in physical assembly and training tasks. A remote user can activate the instructions through simple and intuitive interaction, then clear instructions are shown in both AR (local) and VR (remote) views, enabling a local worker to operate the tool following the instructions. In the demonstration we use a hammer operation as a physical task, showing the benefits of the adaptive MR remote collaborative platform.},

  urldate = {2024-04-26},
  abstract = {to create an integrated space. We consider an MR configuration in which collocated collaborators work around a tabletop display, while remote collaborators wear an HMD to interact with a connected virtual environment that gives a 3D perspective, and consider the impact of varying degrees of view congruence with their collaborators. In a within-subjects study with 18 groups of 3, groups completed task scenarios involving 3D object manipulation around a physical-virtual mapped tabletop. We compare a synchronized Tabletop display baseline and two MR conditions with different levels of view congruence: Fishtank and Hover. Fishtank has a high degree of congruence as it shares a top-down perspective of the 3D objects with the tabletop collaborators. The Hover condition has less view congruence since 3D content hovers front of the remote collaborator above the table. The MR conditions yielded higher self-reported awareness and co-presence than the Tabletop condition for both collocated and remote participants. Remote collaborators significantly preferred the MR conditions for manipulating shared 3D models and communicating with their collaborators. Our findings illustrate strengths and weaknesses of both MR techniques but show that more participants preferred the less-congruent Hover condition overall. Reasons include that it facilitated interaction and viewing 3D objects.},

  abstract = {Mixed Reality (MR) remote collaboration provides an enhanced immersive experience where a remote user can provide verbal and nonverbal assistance to a local user to increase the efficiency and performance of the collaboration. This is usually achieved by sharing the local user's environment through live 360 video or a 3D scene, and using visual cues to gesture or point at real objects allowing for better understanding and collaborative task performance. While most of prior work used one of the methods to capture the surrounding environment, there may be situations where users have to choose between using 360 panoramas or 3D scene reconstruction to collaborate, as each have unique benefits and limitations. In this paper we designed a prototype system that combines 360 panoramas into a 3D scene to introduce a novel way for users to interact and collaborate with each other. We evaluated the prototype through a user study which compared the usability and performance of our proposed approach to live 360 video collaborative system, and we found that participants enjoyed using different ways to access the local user's environment although it took them longer time to learn to use our system. We also collected subjective feedback for future improvements and provide directions for future research.},

  abstract = {In this paper, we investigate the social aspects and effects of various visual cues in a 360 panorama-based Mixed Reality remote collaboration system. We conducted a series of user studies using a prototype system to compare the effects of different combinations of visual cues including hand gestures, ray pointing and drawing in a remote collaborative task. We found that adding ray pointing and drawing can enhance the social aspects of a remote collaborative experience and also can lower the required task mental effort. We discuss the findings and suggest directions for future research.},

  urldate = {2023-06-13},
  abstract = {Research has shown that Mixed Presence (MP) systems are a valuable collaboration tool. However current research into MP systems is limited to a handful of tabletop and Virtual Reality (VR) systems with no exploration of Head-Mounted Display (HMD) based Mixed Reality (MR) solutions. In this paper, we present a prototype HMD based MR Mixed Presence system we designed and developed. We conducted a user study to investigate how different role assignment affects coordination and engagement in a group task with two local users using MR HMDs, and one remote user with a desktop-based Augmented Reality (AR) interface. The results indicated that the role of coordinator significantly increased the remote user's engagement with increased usage of visual communication cues. This is further supported by the mental effort and perceived dominance reported by users. Feedback from users also indicated visual communication cues are valuable for remote users in MP systems.},

}`,DOI:"10.1145/3359997.3365691","Use Case: Task/Task Type":["Assembly & Arrangement"],"Use Case: Domain":["Design & Creativity"],"Study Task":["object arrangement and manipulation"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":["presence"],"accessibility & inclusion":[],"asymmetric experiences":["content & environment sharing","interaction & general capabilities"],"interaction & UI design":["general - interaction & UI design"],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2020",Authors:["Jacob Young","Tobias Langlotz","Steven Mills","Holger Regenbrecht"],Name:"Mobileportation: Nomadic Telepresence for Mobile Devices",Bibtex:`@article{young2020mobileportation,

  urldate = {2024-09-08},
  abstract = {The desire to stay connected to one another over large distances has guided decades of telepresence research. Most focuses on stationary solutions that can deliver high-fidelity telepresence experiences, but these are usually impractical for the wider population who cannot afford the necessary proprietary equipment or are unwilling to regress to non-mobile communication. In this paper we present Mobileportation, a nomadic telepresence prototype that takes advantage of recent developments in mobile technology to provide immersive experiences wherever the user desires by allowing for seamless transitions between ego- and exocentric views within a mutually shared three-dimensional environment. The results of a user study are also discussed that show Mobileportation's ability to induce a sense of presence within this environment and with the remote communication partner, as well as the potential of this platform for future telepresence research.},

}`,DOI:"10.1145/3397331","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Various & Unspecified","Social & Play"],"Study Task":["communication"],"device limitations":["general - device limitations","tracking"],"scene acquisition & reconstruction":["3D reconstruction"],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":["general latency"],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2020",Authors:["Nicolas Kahrl","Michael Prilla","Oliver Blunk"],Name:"Show me your living room: investigating the role of representing user environments in AR remote consultations",Bibtex:`@inproceedings{kahrl2020show,
  title = {Show Me Your Living Room: Investigating the Role of Representing User Environments in {{AR}} Remote Consultations},
  booktitle = {Proceedings of {{Mensch Und Computer}} 2020},

  address = {New York, NY, USA},
  doi = {10.1145/3404983.3405520},
  abstract = {The study reported here investigates AR based support for remote consultations, in which an on-site user is supported by a remote helper. In such situations, it is important for the remote helper (or, in our case, the consultant) to see the environment of the person asking for support in order to relate to it. Based on literature, we created and tested different mechanisms using a 2D video stream with a captured 2D/3D texturized virtual model of the room. In addition, we compared the often-used way of fixing the remote helper's view to the view of the on-site user with the possibility to move around freely in the 2D/3D model. The aim of the study was evaluating how to support an on-site user wearing an AR HMD. The study tested four conditions composed from these differences and with nine real furniture consultants. In the study, we compared four mechanisms in which the consultants were able to place furniture in the living room of a customer and advise the customer on their purchase. We found that there were hardly any differences in task load, social presence or perceived support between the four different conditions. However, participants had clear preferences for certain conditions and aspects of them. From our analysis, we provide recommendations for the design of mixed reality support for remote consultations.},

  title = {Virtual {{Makerspaces}}: {{Merging AR}}/{{VR}}/{{MR}} to {{Enable Remote Collaborations}} in {{Physical Maker Activities}}},
  booktitle = {Extended {{Abstracts}} of the 2021 {{CHI Conference}} on {{Human Factors}} in {{Computing Systems}}},

  address = {New York, NY, USA},
  doi = {10.1145/3411763.3451561},
  abstract = {We present a mixed-reality system for remote collaborations, where collaborators can discuss, explore, create and learn about 3D physical objects. The system combines Hololens augmented reality, 3D Kinect cameras, PC and virtual reality interfaces, into a virtual space that hosts remote collaborators, and physical \\&amp; virtual objects.When talented people have access to fabrication tools and expertise, incredible inventions can be manifested to solve local and global problems. Because of this, the \`\`maker movement'' is a growing phenomenon, manifested through the increased number of maker spaces in many affluent communities. However, many talented individuals lack access to resources in their local communities, and collaboration opportunities with remote experts are wasted due to the limitations of current teleconferencing systems. We present a mixed-reality (MR) system for enabling remote collaborations in the context of maker activities, that allows groups of students and instructors to discuss, explore, create and learn about physical objects. The system combines augmented reality (AR) headsets, 3D cameras, PC and virtual reality (VR) interfaces, into a virtual space that contains multiple remote students, instructors, physical and virtual objects. Remote students can see a real-time 3D scan of the on-site user's physical environment, and the virtual avatars of other students. The system can support learning and exploration by showing virtual overlays on real objects (ex: showing a physical robot's sensor data or internal circuitry) while responding to real-time manipulation of physical objects by the on-site user; and can support design activities by allowing remote and local participants to annotate physical objects with virtual drawings and virtual models. This platform is being developed as an open-source project, and we are currently building applications with the intention to deploy in hybrid makerspace classrooms involving on-site and remote students.},
  isbn = {978-1-4503-8095-9},
  keywords = {collaborative learning,maker spaces,mixed reality,Read MS,remote education},
  file = {D:\\_Zotero\\storage\\GQCARWZQ\\Radu et al_2021_Virtual Makerspaces.pdf}

  urldate = {2024-02-14},
  abstract = {Traumatic injuries require timely intervention, but medical expertise is not always available at the patient's location. Despite recent advances in telecommunications, surgeons still have limited tools to remotely help inexperienced surgeons. Mixed Reality hints at a future where remote collaborators work side-by-side as if co-located; however, we still do not know how current technology can improve remote surgical collaboration. Through role-playing and iterative-prototyping, we identify collaboration practices used by expert surgeons to aid novice surgeons as well as technical requirements to facilitate these practices. We then introduce ARTEMIS, an AR-VR collaboration system that supports these key practices. Through an observational study with two expert surgeons and five novice surgeons operating on cadavers, we find that ARTEMIS supports remote surgical mentoring of novices through synchronous point, draw, and look affordances and asynchronous video clips. Most participants found that ARTEMIS facilitates collaboration despite existing technology limitations explored in this paper.},

  booktitle = {Proceedings of the 32nd {{Australian Conference}} on {{Human-Computer Interaction}}},

  address = {New York, NY, USA},
  doi = {10.1145/3441000.3441038},
  abstract = {In this paper, we present a Mixed Reality (MR) remote collaboration system that enables hybrid view sharing from the local worker to the remote expert for real-time remote guidance. The local worker can share either a 2D first-person view, a 360{$^\\circ$} live view with a fixed viewpoint, or a 3D free view within a point-cloud reconstruction of the local environment. The remote expert can access these views and freely switch between them in Virtual Reality (VR) for better awareness of the local worker's surroundings. We investigate the remote experts' behaviours while using the hybrid view interface during typical pick-and-place remote guiding tasks. We found that the remote experts prefer to learn the local physical layout and search for the targets with a global perspective from the 3D free view. The results also showed that the experts chose to use the 360{$^\\circ$} live view with independent view control rather than the 2D first-person view with high-resolution to control the task procedures and check the local worker's actions. Our study informs the viewpoint interface design for a MR remote collaboration system in various guiding scenarios.},

  abstract = {The world is entering a new normal of hybrid organisations, in which it will be common that some members are co-located and others are remote. Hybridity is rife with asymmetries that affect our sense of belonging in an organisational space. This paper reports a study of an XR Telepresence technology probe to explore how remote workers might present themselves and be perceived as an equal and unique embodied being in a workplace. VROOM (Virtual Robot Overlay for Online Meetings) augments a standard Mobile Robotic Telepresence experience by (1) adding a virtual avatar overlay of the remote person to the local space, viewable through a HoloLens worn by the local user, through which the remote user can gesture and express themselves, and (2) giving the remote user an immersive 360{$^\\circ$} view of the local space, captured by a 360{$^\\circ$} camera on the robot, which they can view through a VR headset. We ran a study to understand how pairs of participants (one local and one remote) collaborate using VROOM in a search and word-guessing game. Our findings illustrate that there is much potential for a system like VROOM to support dynamic collaborative activities in which embodiment, gesturing, mobility, spatial awareness, and non-verbal expressions are important. However, there are also challenges to be addressed, specifically around proprioception, the mixing of a physical robot body with a virtual human avatar, uncertainties of others' views and capabilities, fidelity of expressions, and the appearance of the avatar. We conclude with further design suggestions and recommendations for future work.},

  file = {D:\\_Zotero\\storage\\83P6PCXN\\Jones et al. - 2021 - Belonging There VROOM-ing into the Uncanny Valley.pdf}
}`,DOI:"10.1145/3449133","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["communication","locating object in environment"],"device limitations":["tracking"],"scene acquisition & reconstruction":["scale of environment & tracking area"],"user acquisition & modelling":["face & gaze tracking","hand tracking"],"system complexity":["scalability"],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":["controlling real-world properties"],"spatial awareness & orientation":[],"user representation & techniques":["avatar designs & uncanny valley","level of detail & accuracy"],"communication & sensory feedback":["facial expressions & eyes"],"interpersonal awareness":[],"cognition & presence":["co- & social-presence","general - cognition & presence"],"accessibility & inclusion":["accessibility & inclusion"],"asymmetric experiences":["general - asymmetric experiences","interaction & general capabilities","awareness on shared personal information"],"interaction & UI design":[],"evaluation & studies":["evaluation & studies"],"domain & use case specific":[],"data privacy & security":[]},{Year:"2021",Authors:["Florian Jasche","Jasmin Kirchh{\\u}bel","Thomas Ludwig","Peter Tolmie"],Name:"BeamLite: Diminishing Ecological Fractures of Remote Collaboration through Mixed Reality Environments",Bibtex:`@inproceedings{jasche2021beamlite,

  doi = {10.1145/3461564.3461566},
  abstract = {Developing systems to support remote collaboration usually involves creating new environments in which non-co-located participants produce actions that are, at least in part, accessible to one another. However, this typically fractures the relationship between those actions and the sense of a shared environment, engendering difficulties that can render even the simplest of activities problematic. This becomes more pronounced as the activities become more complex and involve physical artifacts. Although mixed reality seems to offer promising ways of overcoming these troubles, there is still a risk of replicating the fractured ecology problem. We report on an empirical study and the development of a mixed reality prototype called BeamLite that seeks to bypass such issues by providing participants with the illusion of them sharing a single familiar place. Although our evaluation revealed possibilities for evading some troubles associated with artifact-focused remote collaboration, it exposed the need for virtual toolboxes that dynamically support specific work practices and the importance of virtual artifacts embedded within the physical environment to further diminish the sense of ecological fracture.},
  isbn = {978-1-4503-9056-9},
  keywords = {Augmented Reality,Mixed Reality,Remote Collaboration,Unfractured Ecologies,Virtual Reality},
  file = {D:\\_Zotero\\storage\\ZFCZJMNE\\Jasche et al_2021_BeamLite.pdf}
}`,DOI:"10.1145/3461564.3461566","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Design & Creativity"],"Study Task":["communication"],"device limitations":["tracking"],"scene acquisition & reconstruction":[],"user acquisition & modelling":["face & gaze tracking","hand tracking"],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":["dissimilar spaces","shared objects"],"spatial awareness & orientation":["locating  objects & user"],"user representation & techniques":["avatar designs & uncanny valley","general - user representation & techniques"],"communication & sensory feedback":["non-verbal","gestures","facial expressions & eyes"],"interpersonal awareness":[],"cognition & presence":["co- & social-presence"],"accessibility & inclusion":[],"asymmetric experiences":["general - asymmetric experiences"],"interaction & UI design":["adaptive & customizable UI"],"evaluation & studies":[],"domain & use case specific":["domain & use case specific"],"data privacy & security":[]},{Year:"2021",Authors:["Sunny Zhang","Brennan Jones","Sean Rintel","Carman Neustaedter"],Name:"XRmas: Extended Reality Multi-Agency Spaces for a Magical Remote Christmas",Bibtex:`@inproceedings{zhang2021xrmas,

  doi = {10.1145/3462204.3481782},
  abstract = {The COVID-19 pandemic has raised attention toward remote and hybrid communications. Currently, one highly-studied solution lets a remote user use virtual reality (VR) to enter an immersive view of a local space, and local users use augmented reality (AR) to see the remote user's representation and digital contents. Such systems give the remote user a sense of \`being there', but we identify two more challenges to address. First, current systems provide remote users with limited agency to control objects and influence the local space. It is necessary to further explore the relationship between users, virtual objects, and physical objects, and how they can play a role in providing richer agency. Second, current systems often try to replicate in-person experiences, but hardly surpass them. We propose XRmas: an AR/VR telepresence system that (1) provides a multi-agency space that allows a remote user to manipulate both virtual and physical objects in a local space, and (2) introduces three family activities in a Christmas context that adopt holographic animation effects to create a \`magical' experience that takes users beyond merely the feeling of \`being there'. We report on preliminary insights from the use of such a system in a remote family communication context.},
  isbn = {978-1-4503-8479-7},
  file = {D:\\_Zotero\\storage\\VH2MZKGX\\Zhang et al_2021_XRmas.pdf}
}`,DOI:"10.1145/3462204.3481782","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Social & Play"],"Study Task":["walkthrough"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":["controlling real-world properties"],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":["content & environment sharing","interaction & general capabilities"],"interaction & UI design":["general - interaction & UI design"],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2021",Authors:["Tooba Ahsen","Zi Yi Lim","Aaron L. Gardony","Holly A. Taylor","Jan P de Ruiter","Fahad Dogar"],Name:"The Effects of Network Outages on User Experience in Augmented Reality Based Remote Collaboration - An Empirical Study",Bibtex:`@article{ahsen2021effects,

  doi = {10.1145/3476054},
  abstract = {Augmented Reality (AR) applications can enable geographically distant users to collaborate using shared video feeds or interactive 3D holograms, and may be particularly useful in the socially distant context of the Covid-19 pandemic. However, a good user experience is key for their success and could be negatively impacted by network impairments, which are an inevitable occurrence in today's best-effort Internet. In this paper, we present the findings of an empirical user study, aimed at understanding the effects of network outages, on user experience and behavior, in a collaborative AR task. We highlight how network outages affected users in different ways depending on their role in the collaborative task, and how giving users explicit information about poor network conditions helped them deal with some of these negative effects. Furthermore, we report the strategies that users themselves adopted, to deal with outages, such as batching instructions, or shifting to a different spatial referencing style when communicating with their partners. Lastly, based on our findings, we present some design implications for future remote-collaborative AR applications.},

}`,DOI:"10.1145/3476054","Use Case: Task/Task Type":["Instruction & Guidance"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["object arrangement and manipulation","locating object in environment"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":["network challenges","bandwidth issue"],"spatial consistency":["general - spatial consistency"],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":["general - communication & sensory feedback"],"interpersonal awareness":["general - interpersonal awareness"],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":["general - asymmetric experiences"],"interaction & UI design":["general - interaction & UI design"],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2021",Authors:["Yongjae Lee","Byounghyun Yoo","Soo-Hong Lee"],Name:"Sharing Ambient Objects Using Real-time Point Cloud Streaming in Web-based XR Remote Collaboration",Bibtex:`@inproceedings{lee2021sharing,

  doi = {10.1145/3485444.3487642},
  abstract = {Extended reality (XR) collaboration enables collaboration between physical and virtual spaces. Recent XR collaboration studies have focused on sharing and understanding the overall situation of the objects of interest (OOIs) and its surrounding ambient objects (AOs) rather than simply recognizing the existence of OOI. The sharing of the overall situation is achieved using three-dimensional (3D) models that replicate objects existing in the physical workspace. There are two approaches for creating the models: pre-reconstruction and real-time reconstruction. The pre-reconstruction approach takes considerable time to create polygon meshes precisely, and the real-time reconstruction approach requires a considerable time to install numerous sensors to perform accurate 3D scanning. In addition, these approaches are difficult to be used on the collaboration in a location beyond the reconstructed space, making them impractical to an actual XR collaboration. The approach proposed in this study separates the objects that form the physical workspace into OOI and AO, models only the OOI as a polygon mesh in advance, and reconstructs the AO into a point cloud using light detection and ranging technology for collaboration. The reconstructed point cloud is shared with remote collaborators through WebRTC, a web-based peer-to-peer networking technology with low latency. Each remote collaborator collects the delivered point cloud to form a virtual space, so that they can intuitively understand the situation at a local site. Because our approach does not create polygon meshes for all objects existing at the local site, we can save time to prepare for collaboration. In addition, we can improve the practicality of XR collaboration by eliminating the need to install numerous sensors at the local site. We introduce a prototype and an example scenario to demonstrate the practicality of our approach.},
  isbn = {978-1-4503-9095-8},
  keywords = {Augmented reality,Extended reality,Real-time point cloud streaming,Remote XR collaboration,Virtual reality,Web-based XR,XR},
  file = {D:\\_Zotero\\storage\\B98V2JKA\\Lee et al_2021_Sharing Ambient Objects Using Real-time Point Cloud Streaming in Web-based XR.pdf}

  doi = {10.1145/3512928},
  abstract = {Current times are accelerating new technologies to provide high-quality education for remote collaboration, as well as hands-on learning. This is particularly important in the case of laboratory-based classes, which play an essential role in STEM education. In this paper, we introduce ColabAR, a toolkit that uses physical proxies to manipulate virtual objects in Tangible Augmented Reality (TAR) laboratories. ColabAR introduces haptic-based customizable interaction techniques to promote remote collaboration between students. Our toolkit provides hardware and software that enable haptic feedback to improve user experience and promote collaboration during learning. Also, we present the architecture of our cloud platform for haptic interaction that supports information sharing between students in a TAR laboratory. We performed two user studies (N=40) to test the effect of our toolkit in enriching local and remote collaborative experiences. Finally, we demonstrated that our TAR laboratory enables students' performance (i.e., lab completion rate, lab scores) to be similar to their performance in an in-person laboratory.},

}`,DOI:"10.1145/3532834.3536216","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["no study"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":["heterogeneity & interoperability"],"latency & real-time presentation":["general latency"],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":["physical props & haptic feedback"],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2023",Authors:["Sophie Maria","Helena M. Mentis","Geoffroy Canlorbe","Ignacio Avellino"],Name:"Supporting Collaborative Discussions In Surgical Teleconsulting Through Augmented Reality Head Mounted Displays",Bibtex:`@inproceedings{maria2023supporting,

  doi = {10.1145/3544548.3580714},
  abstract = {Although Augmented Reality (AR) has been touted as the future of surgery, its contribution to distributed collaboration such as in surgical teleconsulting has not been articulated. We propose AR-Head Mounted Displays (AR-HMD) to tackle two previously-identified challenges: operating surgeons needing to view and interact with imaging systems that reside away from the operative field, and, their lack of gesturing tools to point and annotate on the shared images and physical environment. We report on a controlled lab experiment where 12 expert gynecology surgeons perform a tumor localisation task guided by a remote radiologist (confederate) via an AR-HMD. We find that bringing the shared images to the place of work reduces the need for clarifications and provides opportunistic access to information when required, and, that pointing and annotating provides opportunities to further support verbal instruction in deictic communication. Our results inform the design of intraoperative AR-HMD systems for surgical telecollaboration.},

  shorttitle = {Wish {{You Were Here}}},

  year = {2023},

  publisher = {Association for Computing Machinery},

  doi = {10.1145/3544548.3581162},
  urldate = {2023-06-13},
  abstract = {With face-to-face music collaboration being severely limited during the recent pandemic, mixed reality technologies and their potential to provide musicians a feeling of "being there" with their musical partner can offer tremendous opportunities. In order to assess this potential, we conducted a laboratory study in which musicians made music together in real-time while simultaneously seeing their jamming partner's mixed reality point cloud via a head-mounted display and compared mental effects such as flow, affect, and co-presence to an audio-only baseline. In addition, we tracked the musicians' physiological signals and evaluated their features during times of self-reported flow. For users jamming in mixed reality, we observed a significant increase in co-presence. Regardless of the condition (mixed reality or audio-only), we observed an increase in positive affect after jamming remotely. Furthermore, we identified heart rate and HF/LF as promising features for classifying the flow state musicians experienced while making music together.},

}`,DOI:"10.1145/3544548.3581162","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Social & Play"],"Study Task":["information extraction and generation"],"device limitations":["display"],"scene acquisition & reconstruction":["point cloud Level of Detail"],"user acquisition & modelling":["face & gaze tracking"],"system complexity":[],"latency & real-time presentation":["general latency"],"spatial consistency":[],"shared & blended environment":[],"spatial awareness & orientation":[],"user representation & techniques":[],"communication & sensory feedback":["facial expressions & eyes"],"interpersonal awareness":[],"cognition & presence":["cognitive & mental load"],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2023",Authors:["Andrew Irlitti","Mesut Latifoglu","Qiushi Zhou","Martin N Reinoso","Thuong Hoang","Eduardo Velloso","Frank Vetere"],Name:"Volumetric Mixed Reality Telepresence for Real-time Cross Modality Collaboration",Bibtex:`@inproceedings{irlitti2023volumetric,

  urldate = {2023-06-13},
  abstract = {Mixed-reality telepresence allows local and remote users feel as if they are present together in the same space. In this paper we report on a mixed-reality volumetric telepresence system that is adaptable, multi-user and cross-modal, i.e. combining augmented and virtual reality technologies with face-to-face interactions. The system extends state-of-art by creating full-body and environmental volumetric renderings in real-time over local enterprise networks. We report findings of an evaluation in a training scenario which was adapted for remote delivery and led by an industry professional. Analysis of interviews and observed behaviours identify varying attitudes towards virtually mediated full-body experiences and highlight the impact of volumetric mixed-reality telepresence to facilitate personal experiences of co-presence and to ground communication with interlocutors.},

}`,DOI:"10.1145/3544548.3581277","Use Case: Task/Task Type":["Instruction & Guidance"],"Use Case: Domain":["Education & Knowledge Work"],"Study Task":["training, instruction, guiding"],"device limitations":[],"scene acquisition & reconstruction":["general - scene acquisition & reconstruction"],"user acquisition & modelling":["body tracking","general - user acquisition & modelling"],"system complexity":["devices & sensors"],"latency & real-time presentation":[],"spatial consistency":[],"shared & blended environment":["general - shared & blended environment"],"spatial awareness & orientation":["dynamic changes","locating  objects & user"],"user representation & techniques":["level of detail & accuracy"],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":["presence"],"accessibility & inclusion":[],"asymmetric experiences":["content & environment sharing"],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2023",Authors:["Mehrad Faridan","Bheesha Kumari","Ryo Suzuki"],Name:"ChameleonControl: Teleoperating Real Human Surrogates through Mixed Reality Gestural Guidance for Remote Hands-on Classrooms",Bibtex:`@inproceedings{faridan2023chameleoncontrol,

  shorttitle = {{{ChameleonControl}}},

  doi = {10.1145/3544548.3581381},
  urldate = {2024-02-02},
  abstract = {We present ChameleonControl, a real-human teleoperation system for scalable remote instruction in hands-on classrooms. In contrast to existing video or AR/VR-based remote hands-on education, ChameleonControl uses a real human as a surrogate of a remote instructor. Building on existing human-based telepresence approaches, we contribute a novel method to teleoperate a human surrogate through synchronized mixed reality hand gestural navigation and verbal communication. By overlaying the remote instructor's virtual hands in the local user's MR view, the remote instructor can guide and control the local user as if they were physically present. This allows the local user/surrogate to synchronize their hand movements and gestures with the remote instructor, effectively teleoperating a real human. We deploy and evaluate our system in classrooms of physiotherapy training, as well as other application domains such as mechanical assembly, sign language and cooking lessons. The study results confirm that our approach can increase engagement and the sense of co-presence, showing potential for the future of remote hands-on classrooms.},
  isbn = {978-1-4503-9421-5},

  abstract = {Mixed Reality allows for distributed meetings where people's local physical spaces are virtually aligned into blended interaction spaces. In many cases, people's physical rooms are dissimilar, making it challenging to design a coherent blended space. We introduce the concept of Partially Blended Realities (PBR) --- using Mixed Reality to support remote collaborators in partially aligning their physical spaces. As physical surfaces are central in collaborative work, PBR supports users in transitioning between different configurations of tables and whiteboard surfaces. In this paper, we 1) describe the design space of PBR, 2) present RealityBlender to explore interaction techniques for how users may configure and transition between blended spaces, and 3) provide insights from a study on how users experience transitions in a remote collaboration task. With this work, we demonstrate new potential for using partial solutions to tackle the alignment problem of dissimilar spaces in distributed Mixed Reality meetings.},

  doi = {10.1145/3555564},
  abstract = {In a remote collaboration involving a physical task, visualising gaze behaviours may compensate for other unavailable communication channels. In this paper, we report on a 360{$^\\circ$} panoramic Mixed Reality (MR) remote collaboration system that shares gaze behaviour visualisations between a local user in Augmented Reality and a remote collaborator in Virtual Reality. We conducted two user studies to evaluate the design of MR gaze interfaces and the effect of gaze behaviour (on/off) and gaze style (bi-/uni-directional). The results indicate that gaze visualisations amplify meaningful joint attention and improve co-presence compared to a no gaze condition. Gaze behaviour visualisations enable communication to be less verbally complex therefore lowering collaborators' cognitive load while improving mutual understanding. Users felt that bi-directional behaviour visualisation, showing both collaborator's gaze state, was the preferred condition since it enabled easy identification of shared interests and task progress.},

  doi = {10.1145/3555607},
  abstract = {Establishing an effective collaboration between augmented-reality (AR) and remote desktop users is a challenge because collaborators do not share a common physical space and equipment. Yet, such asymmetrical collaboration configurations are common today for many design tasks, due to the geographical distance of people or unusual circumstances such as a lockdown. We conducted a first study to investigate trade-offs of three remote representations of an AR workspace: a fully virtual representation, a first-person view, and an external view. Building on our findings, we designed ARgus, a multi-view video-mediated communication system that combines these representations through interactive tools for navigation, previewing, pointing, and annotation. We report on a second user study that observed how 12 participants used ARgus to provide remote instructions for an AR furniture arrangement task. Participants extensively used its view transition tools, while the system reduced their reliance on verbal instructions.},

  urldate = {2024-07-31},
  abstract = {A common issue for collaborative mixed reality is the asymmetry of interaction with the shared virtual environment. For example, an augmented reality (AR) user might use one type of head-mounted display (HMD) in a physical environment, while a virtual reality (VR) user might wear a different type of HMD and see a virtual model of that physical environment. To explore the effects of such asymmetric interfaces on collaboration we present a study that investigates the behaviour of dyads performing a word puzzle task where one uses AR and the other VR. We examined the collaborative process through questionnaires and behavioural measures based on positional and audio data. We identified relationships between presence and co-presence, accord and co-presence, leadership and talkativeness, head rotation velocity and leadership, and head rotation velocity and talkativeness. We did not find that AR or VR biased subjective responses, though there were interesting behavioural differences: AR users spoke more words, AR users had a higher median head rotation velocity, and VR users travelled further.},

  doi = {10.1145/3565970.3567700},
  abstract = {Critique sessions are an essential educational activity at the center of many design disciplines, especially those involving the creation of physical mockups. Conventional approaches often require the students and the instructor to be in the same space to jointly view and discuss physical artifacts. However, in remote learning contexts, available tools (such as videoconferencing) are insufficient due to ineffective, inefficient spatial referencing. This paper presents ARCritique, a mobile Augmented Reality application that allows users to 1) scan physical artifacts, generate corresponding 3D models, and share them with distant instructors; 2) view the model simultaneously in a synchronized virtual environment with remote collaborators; and 3) point to and draw on the model synchronously to aid communication. We evaluated ARCritique with seven Industrial Design students and three faculty to use the app in a remote critique setting. The results suggest that direct support for spatial communication improves collaborative experiences.},

  doi = {10.1145/3567561},
  abstract = {The introduction of Augmented Reality (AR) Head Mounted Displays (HMDs) in collaboration between remote and local workers, introduces new challenges given that camera views are now mobile. We introduce HoloMentor, an AR HMD-based collaborative system designed for remote instruction over live mobile views during physical tasks. Through Actionport, we provide a world-stabilized area where remote helpers can dynamically place a pointer and annotations on the physical environment. Through Actionpad, we provide an indirect input mechanism with an absolute position to the Actionport. We show how these innovations worked for participants engaged in a remote instructional task and how they supported effective and efficient communication. Finally, we provide the next steps for addressing AR on mobile views for remote instruction.},

}`,DOI:"10.1145/3567561","Use Case: Task/Task Type":["Assembly & Arrangement","Instruction & Guidance"],"Use Case: Domain":["Various & Unspecified","Maintenance & Industry"],"Study Task":["puzzle and assembly"],"device limitations":[],"scene acquisition & reconstruction":[],"user acquisition & modelling":[],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":["general - spatial consistency"],"shared & blended environment":[],"spatial awareness & orientation":["communication about the environment","dynamic changes"],"user representation & techniques":[],"communication & sensory feedback":[],"interpersonal awareness":[],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":["annotations"],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2022",Authors:["Daniel Immanuel Fink","Johannes Zagermann","Harald Reiterer","Hans-Christian Jetter"],Name:"Re-locations: Augmenting Personal and Shared Workspaces to Support Remote Collaboration in Incongruent Spaces",Bibtex:`@article{fink2022relocations,

  author = {Fink, Daniel Immanuel and Zagermann, Johannes and Reiterer, Harald and Jetter, Hans-Christian},

  doi = {10.1145/3567709},
  abstract = {Augmented reality (AR) can create the illusion of being virtually co-located during remote collaboration, e.g., by visualizing remote co-workers as avatars. However, spatial awareness of each other's activities is limited as physical spaces, including the position of physical devices, are often incongruent. Therefore, alignment methods are needed to support activities on physical devices. In this paper, we present the concept of Re-locations, a method for enabling remote collaboration with augmented reality in incongruent spaces. The idea of the concept is to enrich remote collaboration activities on multiple physical devices with attributes of co-located collaboration such as spatial awareness and spatial referencing by locally relocating remote user representations to user-defined workspaces. We evaluated the Re-locations concept in an explorative user study with dyads using an authentic, collaborative task. Our findings indicate that Re-locations introduce attributes of co-located collaboration like spatial awareness and social presence. Based on our findings, we provide implications for future research and design of remote collaboration systems using AR.},

}`,DOI:"10.1145/3567709","Use Case: Task/Task Type":["Communication & Collaboration"],"Use Case: Domain":["Various & Unspecified"],"Study Task":["information extraction and generation","communication"],"device limitations":["tracking"],"scene acquisition & reconstruction":["general object recognition & alignment"],"user acquisition & modelling":["body tracking"],"system complexity":[],"latency & real-time presentation":[],"spatial consistency":["calibration & alignment"],"shared & blended environment":["virtual content positioning","physical & spatial limits","dissimilar spaces","shared objects"],"spatial awareness & orientation":["general - spatial awareness & orientation","dynamic changes","locating  objects & user"],"user representation & techniques":["level of detail & accuracy"],"communication & sensory feedback":[],"interpersonal awareness":["gaze & view sharing"],"cognition & presence":[],"accessibility & inclusion":[],"asymmetric experiences":[],"interaction & UI design":[],"evaluation & studies":[],"domain & use case specific":[],"data privacy & security":[]},{Year:"2022",Authors:["Jaylin Herskovitz","Yi Fei Cheng","Anhong Guo","Alanson P. Sample","Michael Nebeling"],Name:"XSpace: An Augmented Reality Toolkit for Enabling Spatially-Aware Distributed Collaboration",Bibtex:`@article{herskovitz2022xspace,

  urldate = {2024-09-11},
  abstract = {Augmented Reality (AR) has the potential to leverage environmental information to better facilitate distributed collaboration, however, such applications are difficult to develop. We present XSpace, a toolkit for creating spatially-aware AR applications for distributed collaboration. Based on a review of existing applications and developer tools, we design XSpace to support three methods for creating shared virtual spaces, each emphasizing a different aspect: shared objects, user perspectives, and environmental meshes. XSpace implements these methods in a developer toolkit, and also provides a set of complimentary visual authoring tools to allow developers to preview a variety of configurations for a shared virtual space. We present five example applications to illustrate that XSpace can support the development of a rich set of collaborative AR experiences that are difficult to produce with current solutions. Through XSpace, we discuss implications for future application design, including user space customization and privacy and safety concerns when sharing users' environments.},

  urldate = {2024-09-08},
  abstract = {Nowadays, telepresence systems based on the Extended Reality (XR) system are actively developed and used for remote collaboration due to COVID-19. Still, several issues, such as limited traversable space in Virtual Reality (VR) and require all participants to wear head-mounted display (HMD), stop these systems from being used in our daily life. On the other hand, telepresence robots have been used in various fields before the pandemic. However, these robots also have a limitation in that the current form is incapable of delivering non-verbal expressions, which is essential for social interaction. Therefore, we present a Holobot, a telepresence robot based on the XR system. A remote user connects to the Holobot through VR HMDs, and the Holobot augments a virtual avatar that projects users' facial and gesture expressions. We developed a prototype and conducted a simple field test in the exhibition to receive feedback. VR participants enjoyed exploring remote spaces and interacting with each other through Holobot. Furthermore, remote space participants mentioned that a 1:1 scale avatar helped to build co-presence with the VR user. Based on these insights, we think Holobot could provide design guideline for future telepresence robot. For further approach, we plan to improve our prototype and conduct user test for structured evaluation of our system.},

  doi = {10.1145/3586183.3606727},
  abstract = {This paper introduces HoloBots, a mixed reality remote collaboration system that augments holographic telepresence with synchronized mobile robots. Beyond existing mixed reality telepresence, HoloBots lets remote users not only be visually and spatially present, but also physically engage with local users and their environment. HoloBots allows the users to touch, grasp, manipulate, and interact with the remote physical environment as if they were co-located in the same shared space. We achieve this by synchronizing holographic user motion (Hololens 2 and Azure Kinect) with tabletop mobile robots (Sony Toio). Beyond the existing physical telepresence, HoloBots contributes to an exploration of broader design space, such as object actuation, virtual hand physicalization, world-in-miniature exploration, shared tangible interfaces, embodied guidance, and haptic communication. We evaluate our system with twelve participants by comparing it with hologram-only and robot-only conditions. Both quantitative and qualitative results confirm that our system significantly enhances the level of co-presence and shared experience, compared to the other conditions.},

  abstract = {Immersive technologies such as virtual reality have enabled novel forms of education and training, where students can learn new skills in simulated environments. But some specialized training procedures, e.g. ESA-certified soldering, still involve real-world physical processes with physical lab equipment. Such training sessions require students to travel to teaching labs and may interrupt everyday commitments for a longer period of time. There is a desire to make such training procedures more accessible remotely while keeping any student-to-teacher interaction natural, personal, and engaging. This paper presents a prototype for a remote teaching use case by rendering 3D photorealistic representations into the Augmented Reality (AR) glasses of a student. The teacher is captured with a modular RGBD capture application integrated into a web-based immersive communication platform. The integration offers multiple real-time capture calibration and rendering configurations. Our modular platform allows for an easy evaluation of different technical constraints as well as easy testing of the use case itself. Such evaluation may include a direct comparison of different 3D point-cloud and mesh rendering techniques. Additionally, the overall system allows immersive interaction between the student and the teacher, including augmented text messages for non-intrusive notifications. Our platform offers an ideal testbed for both technical and user-centered immersive communication studies.},

  abstract = {When operating under adverse conditions or at distant locations, it is not always feasible to obtain the assistance of an expert on site. In such cases, remote expert assistance may provide a solution. Current remote assistance systems employ immersive data visualization or video-based communication. By introducing XR-based multi-user communication system to remote expert assistance solutions, we expect to improve the effectiveness of both the operator and the supporting experts. Our multi-user XR collaboration demo integrates XR and cloud/network technologies. It enables three users to collaborate in a way that makes them feel that they are solving a challenging task together.},
